name: Kernel Team Profile Gate

on:
  workflow_dispatch:
  push:
    branches: [hotfix-team-profiles-photos]
    paths:
      - 'index.html'
      - 'assets/kernel-team-profile-fix.js'
      - 'platform/team_profile_regression.py'
      - '.github/workflows/kernel-team-profile-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/kernel-team-profile-fix.js'
      - 'platform/team_profile_regression.py'
      - '.github/workflows/kernel-team-profile-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate photos and all researcher profiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Validate syntax
        run: |
          node --check assets/kernel-team-profile-fix.js
          python -m py_compile platform/team_profile_regression.py
      - name: Start local platform
        run: |
          python -m http.server 4177 >/tmp/kernel-team-profile-http.log 2>&1 &
          echo $! >/tmp/kernel-team-profile-http.pid
          sleep 2
      - name: Run team profile regression
        env:
          BASE_URL: http://127.0.0.1:4177
          TEAM_PROFILE_RESULT: ci-team-profile/result.json
        run: python platform/team_profile_regression.py
      - name: Stop local platform
        if: always()
        run: |
          if [ -f /tmp/kernel-team-profile-http.pid ]; then kill "$(cat /tmp/kernel-team-profile-http.pid)" || true; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-team-profile-result
          path: |
            ci-team-profile/result.json
            /tmp/kernel-team-profile-http.log
          if-no-files-found: warn
          retention-days: 7
