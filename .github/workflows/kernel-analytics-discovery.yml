name: Kernel Analytics Discovery

on:
  push:
    branches: [hotfix-home-visitor-counter-labels]
    paths:
      - '.github/workflows/kernel-analytics-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find analytics endpoint and visitor code
        run: |
          echo '=== script.google.com matches ==='
          grep -RInE 'script\.google\.com|macros/s|ultimos30Dias|ultimos7Dias|visitantes|Visitantes totales|Actividad del sitio' . --exclude-dir=.git || true
