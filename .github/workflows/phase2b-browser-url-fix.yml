name: Phase 2B browser validation URL correction

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - '.github/workflows/phase2b-browser-url-fix.yml'
      - 'platform/.browser-url-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply browser validation URL correction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Validate Formación through a query-backed native route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/kernel-platform-browser-gate.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "            { route: 'quienesSomos/formacion', name: 'formacion', expression: 'html.includes(\"data-kernel-platform-page=\\\\\"academic-background\\\\\"\") && /Formación académica y experiencia|Academic background and experience/i.test(html)' },\n",
                  "            { url: `${baseUrl}/?kernelSection=formacion#/quienesSomos`, name: 'formacion', expression: 'html.includes(\"data-kernel-platform-page=\\\\\"academic-background\\\\\"\") && /Formación académica y experiencia|Academic background and experience/i.test(html)' },\n"
              ),
              (
                  "              const url = `${baseUrl}/#/${check.route}`;\n",
                  "              const url = check.url || `${baseUrl}/#/${check.route}`;\n"
              ),
              (
                  "              summary.push({ name: check.name, route: check.route, url: location.result?.value || url, passed });\n",
                  "              summary.push({ name: check.name, route: check.route || check.url, url: location.result?.value || url, passed });\n"
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected browser URL block not found:\n{old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f platform/.browser-url-fix-trigger
          rm -f .github/workflows/phase2b-browser-url-fix.yml
      - name: Commit browser URL correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/kernel-platform-browser-gate.yml platform/.browser-url-fix-trigger .github/workflows/phase2b-browser-url-fix.yml
          git commit -m "Apply browser validation URL correction"
          git push origin HEAD:fase-2b-platform-integration
