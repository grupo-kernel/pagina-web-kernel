name: Kernel Public Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kernel-public-smoke-test.yml'
      - 'core/activation/.public-smoke-trigger'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-public-smoke-test.yml'
      - 'core/activation/.public-smoke-trigger'

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live public site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check nine public routes and critical data
        env:
          BASE_URL: https://www.grupoelkernel.com
          CACHE_KEY: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ['BASE_URL'].rstrip('/')
          cache_key = os.environ['CACHE_KEY']
          failures = []
          observations = []

          def record(message):
              observations.append(message)
              print(message)

          def fetch(path):
              separator = '&' if '?' in path else '?'
              url = f"{base}/{path.lstrip('/')}{separator}smoke={urllib.parse.quote(cache_key)}"
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Kernel-Public-Smoke-Test/1.1',
                      'Cache-Control': 'no-cache, no-store, max-age=0',
                      'Pragma': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  status = response.status
                  content_type = response.headers.get('Content-Type', '')
                  age = response.headers.get('Age', '')
                  etag = response.headers.get('ETag', '')
                  final_url = response.geturl()
                  record(f"{status} {path} bytes={len(body)} type={content_type} age={age or '-'} etag={etag or '-'} final={final_url}")
                  if status != 200:
                      failures.append(f"{path}: HTTP {status}")
                  return body, content_type

          html_checks = {
              'index.html': ['Trazabilidad bibliográfica', 'Investigadores miembros', 'formacion.html'],
              'quienes_somos.html': ['kernel-navbar', 'page-header', 'Quiénes somos'],
              'equipo.html': ['data-kernel-core-status="public-ready"', 'core/data/researchers.v2.json', 'kernel-core-team__grid'],
              'formacion.html': ['data-kernel-core-status="public-ready"', 'core/data/researchers.v2.json', 'kernel-academic-shell'],
              'lineas.html': ['kernel-navbar', 'Líneas de investigación', 'page-header'],
              'proyectos.html': ['projectsApp', 'core/data/projects.v2.json', 'projects-stats'],
              'publicaciones.html': ['Catálogo verificable', 'core/data/publications.v2.json', 'metrics-callout'],
              'noticias.html': ['Comunidad en movimiento', 'kernel-navbar', 'Noticias y actividades'],
              'contacto.html': ['contact-layout', 'https://formspree.io/f/xqabgepe', 'Enviar mensaje'],
          }

          for path, markers in html_checks.items():
              try:
                  body, _ = fetch(path)
                  text = body.decode('utf-8', errors='replace')
                  title_match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
                  title = re.sub(r'\s+', ' ', title_match.group(1)).strip() if title_match else '(sin title)'
                  record(f"TITLE {path}: {title}")
                  missing = [marker for marker in markers if marker not in text]
                  if missing:
                      for marker in missing:
                          failures.append(f"{path}: falta marcador {marker!r}")
                      normalized = re.sub(r'\s+', ' ', text[:500]).strip()
                      record(f"SNIPPET {path}: {normalized}")
              except Exception as exc:
                  failures.append(f"{path}: {type(exc).__name__}: {exc}")

          json_checks = {
              'core/data/researchers.v2.json': lambda data: (
                  data.get('group', {}).get('member_count') == 9
                  and any(item.get('id') == 'alicia-cordero' for item in data.get('researchers', []))
                  and any(item.get('id') == 'juan-torregrosa' for item in data.get('researchers', []))
              ),
              'core/data/projects.v2.json': lambda data: data.get('summary', {}).get('featured_approved_projects') == 10,
              'core/data/publications.v2.json': lambda data: len(data.get('records', [])) >= 160,
          }

          for path, predicate in json_checks.items():
              try:
                  body, _ = fetch(path)
                  data = json.loads(body.decode('utf-8'))
                  if not predicate(data):
                      failures.append(f"{path}: contenido crítico inesperado")
                      record(f"JSON {path}: {json.dumps(data, ensure_ascii=False)[:800]}")
              except Exception as exc:
                  failures.append(f"{path}: {type(exc).__name__}: {exc}")

          try:
              body, _ = fetch('deployment-version.txt')
              marker = body.decode('utf-8', errors='replace')
              record(f"DEPLOYMENT MARKER: {marker.strip()}")
              if 'source_merge_sha=6376165ad672554e16c53bab1610edb8793526bd' not in marker:
                  failures.append('deployment-version.txt: SHA de activación no reconocido')
          except Exception as exc:
              failures.append(f"deployment-version.txt: {type(exc).__name__}: {exc}")

          report = [
              'Kernel Public Smoke Test',
              f"timestamp={datetime.now(timezone.utc).isoformat()}",
              f"base_url={base}",
              f"cache_key={cache_key}",
              '',
              'OBSERVATIONS',
              *observations,
              '',
              'FAILURES' if failures else 'RESULT',
              *(failures if failures else ['PASS: nueve rutas, tres catálogos y marcador de despliegue verificados.']),
              '',
          ]
          with open('public-smoke-report.txt', 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(report))

          if failures:
              print('\nPUBLIC SMOKE TEST FAILED')
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print('\nPUBLIC SMOKE TEST PASS: nueve rutas, tres catálogos y marcador de despliegue verificados.')
          PY
      - name: Upload public smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-public-smoke-report
          path: public-smoke-report.txt
          if-no-files-found: error
          retention-days: 14
