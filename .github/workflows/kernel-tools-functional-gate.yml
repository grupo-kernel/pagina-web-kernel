name: Kernel Tools Functional Gate

on:
  workflow_dispatch:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'index.html'
      - 'assets/index-BEtvhqLu.js'
      - 'assets/kernel-platform-bridge.js'
      - '.github/workflows/kernel-tools-functional-gate.yml'

permissions:
  contents: write

jobs:
  tools:
    name: Validate Xmera, Banner and Laboratory access
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run functional browser tests with fictitious data
        id: functional
        continue-on-error: true
        run: |
          mkdir -p ci-tools ci-results
          set +e
          python3 -m http.server 4176 >ci-tools/http-server.log 2>&1 &
          server_pid=$!
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          printf '%s\n' "$browser" > ci-tools/browser-path.txt
          if [ -z "$browser" ]; then
            printf 'No Chrome or Chromium executable was found.\n' > ci-tools/bootstrap-error.txt
            exit 1
          fi
          rm -rf /tmp/kernel-tools-cdp-profile
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9226 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/kernel-tools-cdp-profile \
            about:blank >ci-tools/chrome.stdout.log 2>ci-tools/chrome.stderr.log &
          browser_pid=$!
          cleanup() {
            kill "$browser_pid" "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 200); do
            if curl --fail --silent http://127.0.0.1:9226/json/version > ci-tools/cdp-version.json; then ready=1; break; fi
            sleep .1
          done
          if [ "$ready" -ne 1 ]; then
            printf 'Chrome DevTools endpoint did not become available.\n' > ci-tools/bootstrap-error.txt
            exit 1
          fi

          cat > /tmp/kernel-tools-functional.mjs <<'NODE'
          import fs from 'node:fs/promises';

          const endpoint = 'http://127.0.0.1:9226';
          const baseUrl = 'http://127.0.0.1:4176';
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

          async function run() {
            const targetResponse = await fetch(`${endpoint}/json/new?about:blank`, { method: 'PUT' });
            if (!targetResponse.ok) throw new Error(`Could not create CDP target: HTTP ${targetResponse.status}`);
            const target = await targetResponse.json();
            const socket = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              socket.addEventListener('open', resolve, { once: true });
              socket.addEventListener('error', reject, { once: true });
            });

            let commandId = 0;
            const pending = new Map();
            socket.addEventListener('message', event => {
              const message = JSON.parse(String(event.data));
              if (!message.id || !pending.has(message.id)) return;
              const request = pending.get(message.id);
              pending.delete(message.id);
              if (message.error) request.reject(new Error(JSON.stringify(message.error)));
              else request.resolve(message.result);
            });

            const command = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++commandId;
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
              setTimeout(() => {
                if (!pending.has(id)) return;
                pending.delete(id);
                reject(new Error(`CDP command timed out: ${method}`));
              }, 20000);
            });

            const evaluate = async expression => {
              const result = await command('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || 'Runtime evaluation failed.');
              return result.result?.value;
            };

            const waitFor = async (expression, label, attempts = 70) => {
              for (let attempt = 0; attempt < attempts; attempt += 1) {
                await sleep(400);
                if (await evaluate(`Boolean(${expression})`)) return;
              }
              throw new Error(`Timed out waiting for ${label}`);
            };

            const saveDom = async name => {
              const html = await evaluate('document.documentElement.outerHTML');
              await fs.writeFile(`ci-tools/${name}.html`, html || '', 'utf8');
            };

            await command('Page.enable');
            await command('Runtime.enable');
            const results = [];

            await command('Page.navigate', { url: `${baseUrl}/#/herramientas` });
            await waitFor('document.querySelector("#xmera-input") && document.querySelector("#tab-banner")', 'the institutional tools page');

            await evaluate(`(() => {
              const input = document.querySelector('#xmera-input');
              input.value = '20250893    18    4\\n20212267    13    5';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              document.querySelector('#xmera-generate').click();
              return true;
            })()`);
            await waitFor(`document.querySelector('#xmera-output')?.textContent.includes('20250893') && document.querySelector('#xmera-output')?.textContent.includes('20212267') && document.querySelector('#xmera-copy')?.disabled === false`, 'Xmera generated code');
            results.push({ tool: 'ITLA · Xmera', status: 'pass', records: 2 });
            await saveDom('xmera-functional');

            await evaluate(`document.querySelector('#tab-banner').click()`);
            await waitFor('document.querySelector("#open-primer-periodo")', 'Banner period menu');

            await evaluate(`document.querySelector('#open-primer-periodo').click()`);
            await waitFor('document.querySelector("#banner-primer-input")', 'Banner first-period form');
            await evaluate(`(() => {
              const input = document.querySelector('#banner-primer-input');
              input.value = 'A00108671    10    15\\nA00122336    12    18';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              document.querySelector('#banner-primer-process').click();
              return true;
            })()`);
            await waitFor(`/2 estudiante/i.test(document.querySelector('#banner-primer-count')?.textContent || '') && document.querySelector('#banner-primer-download-1ac')?.disabled === false && document.querySelector('#banner-primer-download-2pp')?.disabled === false`, 'Banner 1AC and 2PP validation');
            results.push({ tool: 'UNAPEC · Banner', component: '1AC and 2PP', status: 'pass', records: 2 });
            await saveDom('banner-first-period');

            await evaluate(`document.querySelector('#banner-back').click()`);
            await waitFor('document.querySelector("#open-segundo-periodo")', 'Banner menu after first period');
            await evaluate(`document.querySelector('#open-segundo-periodo').click()`);
            await waitFor('document.querySelector("#banner-segundo-input")', 'Banner second-period form');
            await evaluate(`(() => {
              const input = document.querySelector('#banner-segundo-input');
              input.value = 'A00108671    28\\nA00122336    32';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              document.querySelector('#banner-segundo-process').click();
              return true;
            })()`);
            await waitFor(`/2 estudiante/i.test(document.querySelector('#banner-segundo-count')?.textContent || '') && document.querySelector('#banner-segundo-download')?.disabled === false`, 'Banner 3SP validation');
            results.push({ tool: 'UNAPEC · Banner', component: '3SP', status: 'pass', records: 2 });
            await saveDom('banner-second-period');

            await evaluate(`document.querySelector('#banner-back').click()`);
            await waitFor('document.querySelector("#open-calificacion-final")', 'Banner menu after second period');
            await evaluate(`document.querySelector('#open-calificacion-final').click()`);
            await waitFor('document.querySelector("#banner-final-input")', 'Banner final-exam form');
            await evaluate(`(() => {
              const input = document.querySelector('#banner-final-input');
              input.value = 'A00108671    24\\nA00122336    27';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              document.querySelector('#banner-final-process').click();
              return true;
            })()`);
            await waitFor(`/2 estudiante/i.test(document.querySelector('#banner-final-count')?.textContent || '') && document.querySelector('#banner-final-download')?.disabled === false`, 'Banner 4EF validation');
            results.push({ tool: 'UNAPEC · Banner', component: '4EF', status: 'pass', records: 2 });
            await saveDom('banner-final-exam');

            await command('Page.navigate', { url: `${baseUrl}/#/laboratorioKernel` });
            await waitFor(`/Laboratorio|Iniciar sesión|Área protegida|Sign in|Authentication/i.test(document.documentElement.outerHTML)`, 'the protected Laboratory access page');
            const laboratoryHtml = await evaluate('document.documentElement.outerHTML');
            const protectedAccess = /Iniciar sesión|Área protegida|Sign in|Authentication/i.test(laboratoryHtml);
            results.push({ tool: 'Laboratorio Inteligente', status: 'pass', authentication_guard: protectedAccess });
            await saveDom('laboratory-access');

            const report = { passed: true, fictitious_data_only: true, results };
            await fs.writeFile('ci-tools/functional-summary.json', `${JSON.stringify(report, null, 2)}\n`, 'utf8');
            const message = 'Functional gate PASS: Xmera generated code; Banner validated 1AC, 2PP, 3SP and 4EF; Laboratory protected access rendered.';
            await fs.writeFile('ci-tools/result.txt', `${message}\n`, 'utf8');
            console.log(message);
            await command('Page.close').catch(() => {});
            socket.close();
          }

          run().catch(async error => {
            const message = error?.stack || String(error);
            await fs.writeFile('ci-tools/error.txt', `${message}\n`, 'utf8').catch(() => {});
            console.error(message);
            process.exit(1);
          });
          NODE

          node /tmp/kernel-tools-functional.mjs >ci-tools/node.stdout.log 2>ci-tools/node.stderr.log
          functional_status=$?
          cat ci-tools/node.stdout.log
          cat ci-tools/node.stderr.log >&2
          exit "$functional_status"
      - name: Upload functional diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tools-functional-diagnostic
          path: ci-tools/**
          if-no-files-found: error
          retention-days: 7
      - name: Persist functional result
        if: always() && github.event_name == 'push'
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          FUNCTIONAL_OUTCOME: ${{ steps.functional.outcome }}
        run: |
          mkdir -p ci-results
          if [ -f ci-tools/result.txt ]; then
            status=success
            cp ci-tools/result.txt ci-results/platform-tools-functional.log
          else
            status=failure
            if [ -f ci-tools/error.txt ]; then cp ci-tools/error.txt ci-results/platform-tools-functional.log; elif [ -f ci-tools/bootstrap-error.txt ]; then cp ci-tools/bootstrap-error.txt ci-results/platform-tools-functional.log; else printf 'Functional gate did not produce a diagnostic.\n' > ci-results/platform-tools-functional.log; fi
          fi
          cat > ci-results/platform-tools-functional.json <<EOF
          {
            "phase": "2B",
            "status": "${status}",
            "step_outcome": "${FUNCTIONAL_OUTCOME}",
            "run_id": "${RUN_ID}",
            "validated_sha": "${HEAD_SHA}",
            "fictitious_data_only": true
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/platform-tools-functional.json ci-results/platform-tools-functional.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Phase 2B tools functional result"
          git fetch origin fase-2b-platform-integration
          git rebase origin/fase-2b-platform-integration
          git push origin HEAD:fase-2b-platform-integration
      - name: Enforce functional result
        if: steps.functional.outcome != 'success'
        run: exit 1
