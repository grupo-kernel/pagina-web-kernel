name: Phase 2B supported Formación route correction

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - '.github/workflows/phase2b-formation-route-fix.yml'
      - 'platform/.formation-route-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply supported Formación route correction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Route Formación through the supported Nosotros path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/kernel-platform-bridge.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  const FORMATION_ROUTE = "formacion";\n',
                  '  const FORMATION_ROUTE = "quienesSomos";\n  const FORMATION_SECTION = "formacion";\n'
              ),
              (
                  '  const routeParts = () => location.hash.replace(/^#\\/?/, "").split(/[/?]/).filter(Boolean);\n  const currentRoute = () => (routeParts()[0] || "home").toLowerCase();\n  const selectedResearcherId = () => routeParts()[1] || "miguel-leonardo";\n',
                  '  const routeParts = () => location.hash.replace(/^#\\/?/, "").split(/[/?]/).filter(Boolean);\n  const currentRoute = () => (routeParts()[0] || "home").toLowerCase();\n  const isFormationRoute = () => currentRoute() === FORMATION_ROUTE.toLowerCase() && (routeParts()[1] || "").toLowerCase() === FORMATION_SECTION;\n  const selectedResearcherId = () => routeParts()[2] || "miguel-leonardo";\n'
              ),
              (
                  '    const panel = document.getElementById("submenu-nosotros");\n    if (!panel || panel.querySelector(\'[data-kernel-route="formacion"]\')) return;\n    const reference = panel.querySelector("button[data-route]");\n',
                  '    const panel = document.getElementById("submenu-nosotros");\n    if (!panel) return;\n    const existing = panel.querySelector(\'[data-kernel-route="formacion"]\');\n    if (existing) {\n      const existingLabel = existing.querySelector("span");\n      if (existingLabel) existingLabel.textContent = labels().menu;\n      return;\n    }\n    const reference = panel.querySelector("button[data-route]");\n'
              ),
              (
                  '      location.hash = `#/${FORMATION_ROUTE}`;\n',
                  '      location.hash = `#/${FORMATION_ROUTE}/${FORMATION_SECTION}`;\n'
              ),
              (
                  '    if (currentRoute() !== FORMATION_ROUTE) return;\n',
                  '    if (!isFormationRoute()) return;\n'
              ),
              (
                  '      if (ticket !== renderTicket || currentRoute() !== FORMATION_ROUTE) return;\n',
                  '      if (ticket !== renderTicket || !isFormationRoute()) return;\n'
              ),
              (
                  '          location.hash = `#/${FORMATION_ROUTE}/${encodeURIComponent(button.dataset.kernelAcademicSelect)}`;\n',
                  '          location.hash = `#/${FORMATION_ROUTE}/${FORMATION_SECTION}/${encodeURIComponent(button.dataset.kernelAcademicSelect)}`;\n'
              ),
              (
                  '    if (currentRoute() === FORMATION_ROUTE) {\n',
                  '    if (isFormationRoute()) {\n'
              ),
              (
                  '    formationRoute: FORMATION_ROUTE,\n',
                  '    formationRoute: `${FORMATION_ROUTE}/${FORMATION_SECTION}`,\n'
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected Formación route block not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check assets/kernel-platform-bridge.js
          rm -f platform/.formation-route-fix-trigger
          rm -f platform/.i18n-menu-trigger
          rm -f .github/workflows/phase2b-formation-route-fix.yml
          rm -f .github/workflows/phase2b-i18n-menu-fix.yml
      - name: Commit supported route correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/kernel-platform-bridge.js platform/.formation-route-fix-trigger platform/.i18n-menu-trigger .github/workflows/phase2b-formation-route-fix.yml .github/workflows/phase2b-i18n-menu-fix.yml
          git commit -m "Apply supported Formación route correction"
          git push origin HEAD:fase-2b-platform-integration
