name: Kernel Platform 2B Import Core

on:
  push:
    branches: [fase-2b-integracion-plataforma-xmera-laboratorio]
    paths:
      - 'core/integration/.platform-2b-import-trigger'
      - '.github/workflows/kernel-platform-2b-import-core.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Import Kernel Core into Phase 2B branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout restored public platform
        uses: actions/checkout@v4
        with:
          ref: fase-2b-integracion-plataforma-xmera-laboratorio
          fetch-depth: 0
      - name: Fetch validated Kernel Core from main
        run: git fetch origin main
      - name: Import only non-destructive Kernel Core resources
        run: |
          git checkout origin/main -- \
            core/data/researchers.v2.json \
            core/data/publications.v2.json \
            core/data/projects.v2.json \
            core/modules/team/team-renderer.mjs \
            core/modules/team/team-integration.css \
            core/modules/academic/academic-renderer.mjs \
            core/modules/academic/academic-integration.css \
            core/modules/scientific-profiles/scientific-profiles-renderer.mjs \
            core/modules/scientific-profiles/scientific-profiles.css \
            core/modules/publications/publications-renderer.mjs \
            core/modules/publications/publications.css \
            core/modules/projects/projects-renderer.mjs \
            core/modules/projects/projects.css \
            translations/es.json \
            translations/en.json \
            miguel.jpg \
            natanael.jpg \
            randy.jpg \
            antmel.jpg \
            marino.png \
            marckelly.jpg \
            josealberto.jpg \
            assets/img/alicia-cordero.svg \
            assets/img/juan-torregrosa.svg
      - name: Verify protected platform was not replaced
        run: |
          grep -q 'assets/index-' index.html
          grep -q 'kernel-phase1-patch.js' index.html
          grep -q 'kernel-i18n-full.js' index.html
          test -f core/data/researchers.v2.json
          test -f core/data/publications.v2.json
          test -f core/data/projects.v2.json
      - name: Commit controlled import
        run: |
          rm -f core/integration/.platform-2b-import-trigger
          rm -f .github/workflows/kernel-platform-2b-import-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A core/data core/modules translations miguel.jpg natanael.jpg randy.jpg antmel.jpg marino.png marckelly.jpg josealberto.jpg assets/img core/integration/.platform-2b-import-trigger .github/workflows/kernel-platform-2b-import-core.yml
          git commit -m "Import validated Kernel Core resources without replacing platform"
          git pull --rebase origin fase-2b-integracion-plataforma-xmera-laboratorio
          git push origin HEAD:fase-2b-integracion-plataforma-xmera-laboratorio
