name: Summarize activation workflow runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/summarize-activation-runs.yml'
      - 'core/activation/.summarize-runs-trigger'

permissions:
  contents: write
  actions: read
  pages: read

jobs:
  summarize:
    if: github.event.head_commit.message == 'Summarize activation runs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create compact activation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core/activation
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name | test("Rebuild integrated Kernel production|Kernel SPA-compatible final activation|Restore Kernel SPA assets|GitHub Pages|pages build and deployment"; "i")) | {id,name,head_branch,head_sha,status,conclusion,display_title,run_number,event,created_at,updated_at,html_url}]' > core/activation/current-activation-runs-summary.json
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '{status,commit,created_at,updated_at,duration,error}' > core/activation/current-pages-build-summary.json
      - name: Commit summary and remove controls
        run: |
          rm -f core/activation/.summarize-runs-trigger
          rm -f .github/workflows/summarize-activation-runs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A core/activation/current-activation-runs-summary.json core/activation/current-pages-build-summary.json core/activation/.summarize-runs-trigger .github/workflows/summarize-activation-runs.yml
          git commit -m "Record compact activation run summary"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
