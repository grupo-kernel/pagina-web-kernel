name: Kernel Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'data/**'
      - 'translations/**'
      - '.github/workflows/kernel-quality-gate.yml'
  push:
    branches: [hito-1-kernel-core]
    paths:
      - 'core/**'
      - 'data/**'
      - 'translations/**'
      - '.github/workflows/kernel-quality-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kernel Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate publications candidate
        run: node core/migrate-publications-v2.mjs

      - name: Run general quality gate
        run: node core/run-quality-gate.mjs

      - name: Validate publications candidate
        run: node core/validate-publications-v2.mjs

      - name: Validate projects candidate
        run: node core/validate-projects-v2.mjs

      - name: Validate services candidate
        run: node core/validate-services-v2.mjs

      - name: Validate news candidate
        run: node core/validate-news-v2.mjs

      - name: Verify generated files are reproducible
        run: git diff --exit-code -- core/data/publications.v2.json core/audits/publications-migration-report.json
