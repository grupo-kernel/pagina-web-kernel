name: Request GitHub Pages rebuild

on:
  push:
    branches: [main]
    paths:
      - 'deployment-rebuild-trigger.txt'
      - '.github/workflows/request-pages-rebuild.yml'

permissions:
  contents: write
  pages: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Request final GitHub Pages rebuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/pages-settings.json
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Wait for Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            status=$(printf '%s' "$payload" | jq -r '.status')
            commit=$(printf '%s' "$payload" | jq -r '.commit // ""')
            echo "Attempt ${attempt}: status=${status} commit=${commit}"
            if [ "$status" = "built" ]; then
              exit 0
            fi
            if [ "$status" = "errored" ]; then
              printf '%s\n' "$payload"
              exit 1
            fi
            sleep 10
          done
          echo "Pages build did not finish within the expected time."
          exit 1
      - name: Remove one-time rebuild files
        run: |
          rm -f deployment-rebuild-trigger.txt
          rm -f .github/workflows/request-pages-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A deployment-rebuild-trigger.txt .github/workflows/request-pages-rebuild.yml
          git commit -m "Remove one-time Pages rebuild workflow"
          git push origin HEAD:main
