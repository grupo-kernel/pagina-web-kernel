name: Kernel Public Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kernel-public-smoke-test.yml'
      - 'scripts/public_smoke_test.py'
      - 'core/activation/.public-smoke-trigger'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-public-smoke-test.yml'
      - 'scripts/public_smoke_test.py'
      - 'core/activation/.public-smoke-trigger'

permissions:
  contents: write

jobs:
  smoke:
    name: Verify live public site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run external public smoke test
        env:
          BASE_URL: https://www.grupoelkernel.com
          CACHE_KEY: ${{ github.sha }}
          SMOKE_ATTEMPTS: '3'
          SMOKE_DELAY_SECONDS: '20'
          SMOKE_RESULT: public-smoke-result.json
        run: python scripts/public_smoke_test.py
      - name: Upload public smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-public-smoke-result
          path: public-smoke-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Persist smoke result in repository
        if: always()
        run: |
          if [ ! -f public-smoke-result.json ]; then
            printf '{"status":"missing","message":"Smoke test did not produce a result file."}\n' > public-smoke-result.json
          fi
          mkdir -p core/activation
          cp public-smoke-result.json core/activation/public-smoke-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/activation/public-smoke-result.json
          if git diff --cached --quiet; then
            echo "Smoke result unchanged."
          else
            git commit -m "Record final public smoke test result"
            git push origin HEAD:main
          fi
