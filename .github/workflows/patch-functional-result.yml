name: Patch functional result persistence

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'platform/.patch-functional-result-trigger'
      - '.github/workflows/patch-functional-result.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch functional result persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Catch Chrome shutdown failures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('platform/browser_smoke_test_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '''    driver.quit()\n\nresult = {\n'''
          new = '''    try:\n        driver.quit()\n    except Exception as quit_error:  # noqa: BLE001\n        print(f"Chrome shutdown warning: {quit_error}", flush=True)\n\nresult = {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one shutdown block; found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f platform/.patch-functional-result-trigger
          rm -f .github/workflows/patch-functional-result.yml
      - name: Commit result persistence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A platform/browser_smoke_test_v2.py platform/.patch-functional-result-trigger .github/workflows/patch-functional-result.yml
          git commit -m "Persist functional diagnostics after browser shutdown"
          git push origin HEAD:fase-2b-platform-integration
