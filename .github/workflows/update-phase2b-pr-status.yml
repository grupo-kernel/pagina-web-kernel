name: Update Phase 2B PR status

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'platform/.update-phase2b-pr-trigger'
      - '.github/workflows/update-phase2b-pr-status.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event.head_commit.message == 'Update Phase 2B PR status'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Generate verified PR body
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          result_path = Path('ci-results/phase2b-v3-final.json')
          if result_path.exists():
              result = json.loads(result_path.read_text(encoding='utf-8'))
          else:
              result = {
                  'overall_pass': False,
                  'syntax_pass': False,
                  'structural_pass': False,
                  'browser_pass': False,
                  'browser_failures': ['El registro final todavía no está disponible.']
              }

          mark = lambda value: 'x' if value else ' '
          failures = result.get('browser_failures') or []
          failure_section = ''
          if failures:
              failure_section = '\n## Observaciones pendientes\n\n' + '\n'.join(f'- {item}' for item in failures)

          body = f'''## Propósito

Integrar Kernel Core dentro de la plataforma SPA completa, sin sustituir los menús, las herramientas institucionales ni el Laboratorio Inteligente de Investigación.

## Corrección de alcance

La herramienta institucional se denomina **ITLA · Xmera**, no SARA.

## Plataforma preservada

- [x] Laboratorio Inteligente de Investigación.
- [x] Autenticación Firebase y control de acceso.
- [x] Asistente de selección de pruebas estadísticas.
- [x] Calculadoras y Biblioteca metodológica.
- [x] Herramientas **ITLA · Xmera**.
- [x] Herramientas **UNAPEC · Banner**: 1AC, 2PP, 3SP y 4EF.
- [x] Menús Portada, Servicios, Laboratorio, Investigación, Nosotros, Noticias, Contacto y Solicitar diagnóstico.
- [x] Google Analytics, selector español/inglés y comportamiento responsive de la SPA.

## Kernel Core integrado dentro de la SPA

- [x] Formación académica de los nueve investigadores dentro del menú Nosotros.
- [x] Equipo de nueve investigadores desde `researchers.v2.json`.
- [x] Fotografías oficiales, incluida la fotografía actualizada de Miguel.
- [x] Perfiles científicos y enlaces ORCID/Scholar/ResearchGate/institucionales cuando existen.
- [x] Publicaciones 2.0 con 162 registros únicos.
- [x] Proyectos 2.0 con 10 proyectos aprobados destacados y 48 participaciones adicionales.
- [x] Contenido nuevo disponible en español e inglés.

## Controles v3

- [{mark(result.get('syntax_pass'))}] Sintaxis de los tres puentes JavaScript.
- [{mark(result.get('structural_pass'))}] Preservación estructural de Laboratorio, Xmera, Banner, menús y catálogos.
- [{mark(result.get('browser_pass'))}] Prueba funcional en navegador de la SPA integrada.
- [{mark(result.get('overall_pass'))}] Resultado global de integración.

## Seguridad

- Base pública preservada: `gh-pages`.
- Rama de trabajo: `fase-2b-platform-integration`.
- El PR continúa en borrador.
- La página pública no se modifica con este PR mientras no exista aprobación explícita.
- Kernel Core consolidado continúa respaldado en `main`.
{failure_section}

## Estado

**Fase 2B en integración controlada. No fusionar hasta la revisión visual del usuario y la autorización explícita.**
'''
          Path('/tmp/phase2b-pr-body.md').write_text(body, encoding='utf-8')
          PY
      - name: Update PR #30
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit 30 --body-file /tmp/phase2b-pr-body.md
      - name: Remove one-time update files
        run: |
          rm -f platform/.update-phase2b-pr-trigger
          rm -f .github/workflows/update-phase2b-pr-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A platform/.update-phase2b-pr-trigger .github/workflows/update-phase2b-pr-status.yml
          git commit -m "Remove one-time Phase 2B PR status workflow"
          git push origin HEAD:fase-2b-platform-integration
