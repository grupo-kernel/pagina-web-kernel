name: Kernel Home Navigation Gate

on:
  workflow_dispatch:
  push:
    branches: [hotfix-home-navigation-projects]
    paths:
      - 'index.html'
      - 'assets/kernel-home-navigation-fix.js'
      - 'platform/home_navigation_regression.py'
      - '.github/workflows/kernel-home-navigation-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/kernel-home-navigation-fix.js'
      - 'platform/home_navigation_regression.py'
      - '.github/workflows/kernel-home-navigation-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate title spacing, homepage speed and Projects transition
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Validate syntax
        run: |
          node --check assets/kernel-home-navigation-fix.js
          python -m py_compile platform/home_navigation_regression.py
      - name: Start local platform
        run: |
          python -m http.server 4176 >/tmp/kernel-home-navigation-http.log 2>&1 &
          echo $! >/tmp/kernel-home-navigation-http.pid
          sleep 2
      - name: Run homepage navigation regression
        env:
          BASE_URL: http://127.0.0.1:4176
          HOME_NAV_RESULT: ci-home-navigation/result.json
        run: python platform/home_navigation_regression.py
      - name: Stop local platform
        if: always()
        run: |
          if [ -f /tmp/kernel-home-navigation-http.pid ]; then kill "$(cat /tmp/kernel-home-navigation-http.pid)" || true; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-home-navigation-result
          path: |
            ci-home-navigation/result.json
            /tmp/kernel-home-navigation-http.log
          if-no-files-found: warn
          retention-days: 7
