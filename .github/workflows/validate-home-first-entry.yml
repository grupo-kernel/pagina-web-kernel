name: Validate public home first entry

on:
  pull_request:
    branches:
      - El-Kernel-2.0
    paths:
      - '.github/workflows/validate-home-first-entry.yml'
      - 'scripts/smoke-home-first-entry.mjs'
      - 'scripts/patch-home-bridge.mjs'
      - 'scripts/finalize-analytics-entry.mjs'
      - 'scripts/prepare-gh-pages-index.mjs'
      - 'public/assets/kernel-home-direct-entry-fix.js'
      - 'index.html'

permissions:
  contents: read

jobs:
  webkit-first-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps webkit

      - name: Test first public entry with delayed institutional data
        env:
          KERNEL_BASE_URL: https://www.grupoelkernel.com
          KERNEL_DATA_DELAY_MS: 1800
        run: node scripts/smoke-home-first-entry.mjs
