name: Kernel Platform Phase 2B v3 Gate

on:
  workflow_dispatch:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'index.html'
      - 'assets/kernel-platform-bridge-v3.js'
      - 'assets/kernel-team-core-bridge-v3.js'
      - 'assets/kernel-research-core-bridge.js'
      - 'core/data/**'
      - 'platform/validate-phase2b-v3.mjs'
      - 'platform/test_phase2b_v3.py'
      - '.github/workflows/kernel-platform-v3-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/kernel-platform-bridge-v3.js'
      - 'assets/kernel-team-core-bridge-v3.js'
      - 'assets/kernel-research-core-bridge.js'
      - 'core/data/**'
      - 'platform/validate-phase2b-v3.mjs'
      - 'platform/test_phase2b_v3.py'
      - '.github/workflows/kernel-platform-v3-gate.yml'

permissions:
  contents: read

jobs:
  structural:
    name: Validate complete platform preservation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check assets/kernel-platform-bridge-v3.js
          node --check assets/kernel-team-core-bridge-v3.js
          node --check assets/kernel-research-core-bridge.js
      - name: Run Phase 2B v3 validator
        run: node platform/validate-phase2b-v3.mjs

  browser:
    name: Verify SPA, Laboratory, Xmera, Banner and Kernel Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start controlled static preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/kernel-phase2b-http.log 2>&1 &
          echo $! > /tmp/kernel-phase2b-http.pid
          sleep 3
      - name: Run browser integration test
        env:
          BASE_URL: http://127.0.0.1:4173/
          PHASE2B_RESULT: platform/phase2b-v3-browser-result.json
          PHASE2B_SCREENSHOTS: platform/phase2b-v3-screenshots
        run: python platform/test_phase2b_v3.py
      - name: Upload browser result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-phase2b-v3-browser-validation
          path: |
            platform/phase2b-v3-browser-result.json
            platform/phase2b-v3-screenshots/**
            /tmp/kernel-phase2b-http.log
          if-no-files-found: warn
          retention-days: 14
