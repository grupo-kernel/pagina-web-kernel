name: Kernel Public Post-Deploy Smoke

on:
  push:
    branches: [gh-pages]
    paths:
      - 'post-deploy-final-trigger.txt'
      - '.github/workflows/kernel-public-post-deploy-smoke.yml'

permissions:
  contents: write

jobs:
  public-smoke:
    name: Verify deployed Kernel platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployed branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Wait for GitHub Pages propagation
        run: |
          for attempt in $(seq 1 60); do
            html=$(curl --fail --silent --show-error --location --max-time 30 "https://www.grupoelkernel.com/index.html?deploy=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$html" | grep -q 'kernel-home-2b-bridge.js'; then
              echo "Integrated platform detected publicly on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: integrated platform not visible yet."
            sleep 10
          done
          echo "The integrated platform did not become visible within the expected time."
          exit 1
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Execute public browser smoke test
        env:
          BASE_URL: https://www.grupoelkernel.com
          BROWSER_RESULT: ci-browser/public-postdeploy-result.json
        run: python platform/browser_smoke_test.py
      - name: Upload public smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-public-postdeploy-result
          path: ci-browser/public-postdeploy-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Persist public smoke result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-results
          if [ -f ci-browser/public-postdeploy-result.json ]; then
            cp ci-browser/public-postdeploy-result.json ci-results/platform-public-postdeploy.json
          else
            printf '{"passed":false,"failures":["No se generó el resultado público."]}\n' > ci-results/platform-public-postdeploy.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('ci-results/platform-public-postdeploy.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['workflow_status'] = os.environ['JOB_STATUS']
          data['run_id'] = os.environ['RUN_ID']
          data['validated_sha'] = os.environ['VALIDATED_SHA']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/platform-public-postdeploy.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record public post-deploy smoke result"
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
