name: Live UI DOM Color Audit

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/live-ui-i18n-verification]
    paths:
      - '.github/workflows/live-ui-dom-color-audit.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - '.github/workflows/live-ui-dom-color-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Dump relevant live DOM selectors
        run: |
          mkdir -p live-ui-dom-audit
          python - <<'PY'
          import json, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base='https://www.grupoelkernel.com'
          out=Path('live-ui-dom-audit')
          options=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=1440,1800']:
              options.add_argument(arg)
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,60)
          result={}
          try:
              for route in ['quienesSomos','lineas','herramientas']:
                  driver.get(f'{base}/?audit={int(time.time()*1000)}#/{route}')
                  wait.until(lambda d: d.execute_script('return document.readyState')=='complete')
                  wait.until(lambda d: d.execute_script('return Boolean(window.KernelUiI18nUnification)'))
                  driver.execute_script("localStorage.setItem('kernel-language','en'); document.documentElement.lang='en'; window.dispatchEvent(new CustomEvent('kernel-language-change',{detail:{language:'en'}})); document.dispatchEvent(new CustomEvent('kernel-language-change',{detail:{language:'en'}}));")
                  time.sleep(2)
                  rows=driver.execute_script("""
                    return [...document.querySelectorAll('#main *')].map((e,index)=>{
                      const s=getComputedStyle(e), b=e.getBoundingClientRect(), text=(e.innerText||'').replace(/\\s+/g,' ').trim();
                      return {index,tag:e.tagName.toLowerCase(),id:e.id||'',className:typeof e.className==='string'?e.className:'',background:s.backgroundColor,backgroundImage:s.backgroundImage,color:s.color,width:Math.round(b.width),height:Math.round(b.height),text:text.slice(0,180),html:e.outerHTML.slice(0,1000)};
                    }).filter(x=>x.width>180&&x.height>70&&x.text&&x.background!=='rgba(0, 0, 0, 0)'&&x.background!=='rgb(255, 255, 255)');
                  """)
                  result[route]=rows
              result['footer']=driver.execute_script("return document.getElementById('footer')?.innerText||''")
          finally:
              driver.quit()
          (out/'dom.json').write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-ui-dom-color-audit
          path: live-ui-dom-audit/
          if-no-files-found: error
          retention-days: 7
