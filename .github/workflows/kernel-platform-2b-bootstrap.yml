name: Kernel Platform 2B Bootstrap

on:
  push:
    branches: [fase-2b-integracion-plataforma-xmera-laboratorio]
    paths:
      - 'core/integration/.platform-2b-bootstrap-trigger'
      - 'scripts/inject_platform_bridge.py'
      - '.github/workflows/kernel-platform-2b-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap Phase 2B platform bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 2B branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-integracion-plataforma-xmera-laboratorio
          fetch-depth: 0
      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inject bridge without replacing SPA
        run: python scripts/inject_platform_bridge.py
      - name: Run preservation audit
        run: python scripts/audit_platform_2b.py
      - name: Verify protected shell markers
        run: |
          grep -q 'assets/index-' index.html
          grep -q 'kernel-members-patch.js' index.html
          grep -q 'kernel-i18n-full.js' index.html
          grep -q 'kernel-core-platform-bridge.js' index.html
      - name: Commit controlled bootstrap
        run: |
          rm -f core/integration/.platform-2b-bootstrap-trigger
          rm -f .github/workflows/kernel-platform-2b-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html core/audits/platform-2b-baseline.json core/integration/.platform-2b-bootstrap-trigger .github/workflows/kernel-platform-2b-bootstrap.yml
          git commit -m "Bootstrap Phase 2B platform bridge"
          git pull --rebase origin fase-2b-integracion-plataforma-xmera-laboratorio
          git push origin HEAD:fase-2b-integracion-plataforma-xmera-laboratorio
