name: Deploy Kernel Core to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-pages-deploy.yml'
      - 'core/activation/.pages-deploy-trigger'

permissions:
  contents: write
  pages: write

concurrency:
  group: kernel-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Deploy Kernel Core to GitHub Pages'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate production tree
        run: |
          set -euo pipefail
          test -f CNAME
          test -f .nojekyll
          for page in index.html quienes_somos.html equipo.html formacion.html lineas.html proyectos.html publicaciones.html noticias.html contacto.html; do
            test -s "$page"
          done
          test -s core/data/researchers.v2.json
          test -s core/data/projects.v2.json
          test -s core/data/publications.v2.json
          grep -q 'Publicaciones 2.0' publicaciones.html
          grep -q 'core/data/publications.v2.json' publicaciones.html
          grep -q 'data-kernel-core-status="public-ready"' equipo.html
          grep -q 'data-kernel-core-status="public-ready"' formacion.html
          echo "Validated production tree at $(git rev-parse HEAD)."

      - name: Publish the complete main tree to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
          echo "GH_PAGES_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Request a GitHub Pages build and wait for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" | tee pages-settings.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" | tee pages-build-request.json

          matched=0
          for attempt in $(seq 1 72); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            printf '%s\n' "$payload" > pages-build-latest.json
            status=$(printf '%s' "$payload" | jq -r '.status // ""')
            commit=$(printf '%s' "$payload" | jq -r '.commit // ""')
            echo "Attempt ${attempt}: status=${status} commit=${commit} expected=${GH_PAGES_SHA}"

            if [ "$commit" = "$GH_PAGES_SHA" ] && [ "$status" = "built" ]; then
              matched=1
              break
            fi
            if [ "$commit" = "$GH_PAGES_SHA" ] && [ "$status" = "errored" ]; then
              echo "GitHub Pages reported an error for the target commit."
              exit 1
            fi
            sleep 10
          done

          if [ "$matched" -ne 1 ]; then
            echo "The exact gh-pages commit was not confirmed as built."
            exit 1
          fi

      - name: Run final public smoke test
        env:
          BASE_URL: https://www.grupoelkernel.com
          CACHE_KEY: ${{ env.GH_PAGES_SHA }}
          SMOKE_ATTEMPTS: '10'
          SMOKE_DELAY_SECONDS: '15'
          SMOKE_RESULT: public-smoke-result.json
        run: python scripts/public_smoke_test.py

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-pages-production-deployment
          path: |
            pages-settings.json
            pages-build-request.json
            pages-build-latest.json
            public-smoke-result.json
          if-no-files-found: warn
          retention-days: 30
