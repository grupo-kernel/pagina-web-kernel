name: Synchronize Publications 2.0 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'core/activation/.publications-v2-pages-trigger'
      - '.github/workflows/sync-publications-v2-to-pages.yml'

permissions:
  contents: write
  pages: write

jobs:
  synchronize:
    if: github.event.head_commit.message == 'Synchronize Publications 2.0 to gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate canonical Publications 2.0 integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('publicaciones.html').read_text(encoding='utf-8')
          required = [
              'core/data/publications.v2.json',
              'core/data/researchers.v2.json',
              'renderPublicationCatalog',
              'Publicaciones 2.0',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'Publicaciones 2.0 no está integrada en main: {missing}')
          payload = json.loads(Path('core/data/publications.v2.json').read_text(encoding='utf-8'))
          if payload.get('summary', {}).get('unique_records') != 162 or len(payload.get('records', [])) != 162:
              raise SystemExit('El catálogo v2 no contiene los 162 registros únicos esperados.')
          print('Canonical Publications 2.0 integration validated.')
          PY
          node core/validate-publications-module.mjs
          echo "MAIN_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy canonical Publications 2.0 files to gh-pages
        run: |
          git fetch origin gh-pages
          rm -rf /tmp/kernel-gh-pages
          git worktree add --detach /tmp/kernel-gh-pages origin/gh-pages
          mkdir -p /tmp/kernel-gh-pages/core/data
          cp publicaciones.html /tmp/kernel-gh-pages/publicaciones.html
          cp core/data/publications.v2.json /tmp/kernel-gh-pages/core/data/publications.v2.json
          cp core/modules/publications/publications-renderer.mjs /tmp/kernel-gh-pages/core/modules/publications/publications-renderer.mjs
          cp core/modules/publications/publications.css /tmp/kernel-gh-pages/core/modules/publications/publications.css
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('/tmp/kernel-gh-pages/deployment-version.txt')
          text = path.read_text(encoding='utf-8') if path.exists() else 'Kernel Core public activation\nsource_merge_sha=6376165ad672554e16c53bab1610edb8793526bd\n'
          lines = [line for line in text.splitlines() if not line.startswith('publications_v2_fix_sha=')]
          lines.append(f"publications_v2_fix_sha={os.environ['MAIN_SOURCE_SHA']}")
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cd /tmp/kernel-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicaciones.html core/data/publications.v2.json core/modules/publications/publications-renderer.mjs core/modules/publications/publications.css deployment-version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Deploy complete Publications 2.0 catalog"
            git push origin HEAD:gh-pages
          fi
          echo "GH_PAGES_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Request and wait for GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" | tee pages-settings.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" | tee pages-build-request.json
          for attempt in $(seq 1 48); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            printf '%s\n' "$payload" > pages-build-latest.json
            status=$(printf '%s' "$payload" | jq -r '.status')
            commit=$(printf '%s' "$payload" | jq -r '.commit // ""')
            echo "Attempt ${attempt}: status=${status} commit=${commit}"
            if [ "$status" = "built" ]; then
              break
            fi
            if [ "$status" = "errored" ]; then
              exit 1
            fi
            sleep 10
          done
          test "$(jq -r '.status' pages-build-latest.json)" = "built"

      - name: Verify the live public site
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: https://www.grupoelkernel.com
          CACHE_KEY: ${{ env.GH_PAGES_SHA }}
          SMOKE_ATTEMPTS: '8'
          SMOKE_DELAY_SECONDS: '20'
          SMOKE_RESULT: public-smoke-result.json
        run: python scripts/public_smoke_test.py

      - name: Upload final Publications 2.0 deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-publications-v2-pages-deployment
          path: |
            pages-settings.json
            pages-build-request.json
            pages-build-latest.json
            public-smoke-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce live verification
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Remove one-time deployment controls
        run: |
          rm -f core/activation/.publications-v2-pages-trigger
          rm -f core/activation/.publications-v2-fix-trigger
          rm -f .github/workflows/sync-publications-v2-to-pages.yml
          rm -f .github/workflows/fix-publications-v2-public.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A core/activation/.publications-v2-pages-trigger core/activation/.publications-v2-fix-trigger .github/workflows/sync-publications-v2-to-pages.yml .github/workflows/fix-publications-v2-public.yml
          git commit -m "Remove one-time Publications 2.0 deployment controls"
          git push origin HEAD:main
