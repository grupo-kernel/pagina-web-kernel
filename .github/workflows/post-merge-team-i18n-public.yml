name: Post-merge Team and English Public Check

on:
  push:
    branches: [diagnostic/ui-i18n-audit]
    paths:
      - '.github/workflows/post-merge-team-i18n-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Verify public deployment
        run: |
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          options=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=1440,1600']:
              options.add_argument(arg)
          options.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,60)
          result={'ok':False,'checks':{},'errors':[]}
          try:
              driver.get('https://www.grupoelkernel.com/?postmerge=20260727-1#/equipment')
              wait.until(lambda d: d.execute_script('return document.readyState')=='complete')
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'.kernel-team-core__card'))==9)
              driver.execute_script("localStorage.setItem('kernel-language','en');document.documentElement.lang='en';window.dispatchEvent(new CustomEvent('kernel-language-change',{detail:{language:'en'}}));document.dispatchEvent(new CustomEvent('kernel-language-change',{detail:{language:'en'}}));")
              time.sleep(4)
              headings=[e.text for e in driver.find_elements(By.CSS_SELECTOR,'.kernel-team-core__card h2')]
              body=driver.find_element(By.ID,'main').text
              duplicate=[h for h in headings if len(re.findall(r'(?:Ph\.D\.|M\.Sc\.)',h))>1]
              jose=next((h for h in headings if h.startswith('Jose Alberto Reyes Reyes')),'')
              result['checks']={
                'nine_cards':len(headings)==9,
                'no_duplicate_degrees':not duplicate,
                'jose_one_degree':jose.count('Ph.D.')==1,
                'team_english':'Researcher in numerical methods, PDEs, and mathematics education' in body and 'Investigador en métodos numéricos' not in body,
                'new_degree_module':driver.execute_script("return window.KernelNameDegreeFix?.version")=='1.2.0',
                'team_language_module':driver.execute_script("return window.KernelTeamLanguageFix?.version")=='1.0.0'
              }
              result['headings']=headings
              result['duplicates']=duplicate
              driver.save_screenshot('public-equipment-english.png')
              result['errors']=[x for x in driver.get_log('browser') if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
              result['ok']=all(result['checks'].values()) and not result['errors']
          finally:
              driver.quit()
          Path('public-verification.json').write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if not result['ok']:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-merge-team-i18n-public
          path: |
            public-verification.json
            public-equipment-english.png
          if-no-files-found: warn
          retention-days: 3
