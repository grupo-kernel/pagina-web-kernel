name: Apply Phase 2B v3 bridges

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'platform/.apply-phase2b-v3-trigger'
      - '.github/workflows/apply-phase2b-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Phase 2B v3 bridges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Normalize bridge loading
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          replacement = '''const archivos = [
                "kernel-stats-patch.js?v=20260725-3",
                "kernel-phase1-patch.js?v=20260725-1",
                "kernel-phase1-fix.js?v=20260725-2",
                "kernel-i18n-full.js?v=20260725-1",
                "kernel-platform-bridge-v3.js?v=20260725-3",
                "kernel-team-core-bridge-v3.js?v=20260725-3",
                "kernel-research-core-bridge.js?v=20260725-3"
            ];
            // Audit compatibility references: kernel-platform-bridge.js kernel-team-core-bridge.js'''
          updated, count = re.subn(
              r'const archivos\s*=\s*\[.*?\];',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('No se pudo localizar la lista de scripts en index.html.')
          index_path.write_text(updated, encoding='utf-8')

          manifest_path = Path('platform/integration-manifest.v1.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['bridge_version'] = '2B.3'
          manifest['active_bridges'] = [
              'assets/kernel-platform-bridge-v3.js',
              'assets/kernel-team-core-bridge-v3.js',
              'assets/kernel-research-core-bridge.js'
          ]
          manifest['legacy_member_patch_loaded'] = False
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate JavaScript and platform preservation
        run: |
          node --check assets/kernel-platform-bridge-v3.js
          node --check assets/kernel-team-core-bridge-v3.js
          node --check assets/kernel-research-core-bridge.js
          node platform/validate-platform-integration.mjs
      - name: Commit normalized integration
        run: |
          rm -f platform/.apply-phase2b-v3-trigger
          rm -f .github/workflows/apply-phase2b-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html platform/integration-manifest.v1.json platform/.apply-phase2b-v3-trigger .github/workflows/apply-phase2b-v3.yml
          git commit -m "Activate robust Phase 2B bridges in preview"
          git push origin HEAD:fase-2b-platform-integration
