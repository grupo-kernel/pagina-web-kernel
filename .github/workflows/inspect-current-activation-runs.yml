name: Inspect current activation workflow runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-current-activation-runs.yml'
      - 'core/activation/.inspect-current-runs-trigger'

permissions:
  contents: write
  actions: read
  pages: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect current activation runs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture recent Actions and Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core/activation
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" > core/activation/current-workflow-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/pages" > core/activation/current-pages-settings.json
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" > core/activation/current-pages-build.json
      - name: Persist inspection and remove controls
        run: |
          rm -f core/activation/.inspect-current-runs-trigger
          rm -f .github/workflows/inspect-current-activation-runs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A core/activation/current-workflow-runs.json core/activation/current-pages-settings.json core/activation/current-pages-build.json core/activation/.inspect-current-runs-trigger .github/workflows/inspect-current-activation-runs.yml
          git commit -m "Record current activation workflow state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
