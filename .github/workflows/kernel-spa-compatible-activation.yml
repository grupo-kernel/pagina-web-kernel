name: Kernel SPA-compatible final activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-spa-compatible-activation.yml'
      - 'core/activation/.spa-compatible-activation-trigger'

permissions:
  contents: write
  pages: write

jobs:
  activate:
    if: github.event.head_commit.message == 'Run SPA-compatible final activation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build a SPA-compatible gh-pages revision
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git fetch origin rollback/gh-pages-pre-reactivation-20260725:refs/remotes/origin/rollback/gh-pages-pre-reactivation-20260725
          rm -rf /tmp/kernel-gh-pages
          git worktree add --detach /tmp/kernel-gh-pages origin/gh-pages
          mkdir -p /tmp/kernel-gh-pages/assets /tmp/kernel-gh-pages/core/data /tmp/kernel-gh-pages/core/modules

          for path in \
            assets/kernel-members-patch.js \
            assets/kernel-stats-patch.js \
            assets/kernel-phase1-patch.js \
            assets/kernel-phase1-fix.js \
            assets/kernel-i18n-full.js \
            assets/alicia-cordero-photo.svg \
            assets/juan-torregrosa-photo.svg
          do
            git show "origin/rollback/gh-pages-pre-reactivation-20260725:${path}" > "/tmp/kernel-gh-pages/${path}"
          done

          cp miguel.jpg /tmp/kernel-gh-pages/miguel.jpg
          cp publicaciones.html /tmp/kernel-gh-pages/publicaciones.html
          cp proyectos.html /tmp/kernel-gh-pages/proyectos.html
          cp core/data/researchers.v2.json /tmp/kernel-gh-pages/core/data/researchers.v2.json
          cp core/data/publications.v2.json /tmp/kernel-gh-pages/core/data/publications.v2.json
          cp core/data/projects.v2.json /tmp/kernel-gh-pages/core/data/projects.v2.json
          rm -rf /tmp/kernel-gh-pages/core/modules/publications /tmp/kernel-gh-pages/core/modules/projects
          cp -R core/modules/publications /tmp/kernel-gh-pages/core/modules/publications
          cp -R core/modules/projects /tmp/kernel-gh-pages/core/modules/projects

          rm -f /tmp/kernel-gh-pages/.github/workflows/restore-kernel-spa-assets.yml
          rm -f /tmp/kernel-gh-pages/restore-kernel-spa-assets-trigger.txt

          for path in \
            assets/kernel-members-patch.js \
            assets/kernel-stats-patch.js \
            assets/kernel-phase1-patch.js \
            assets/kernel-phase1-fix.js \
            assets/kernel-i18n-full.js \
            assets/alicia-cordero-photo.svg \
            assets/juan-torregrosa-photo.svg \
            core/data/researchers.v2.json \
            core/data/publications.v2.json \
            core/data/projects.v2.json \
            core/modules/publications/publications-renderer.mjs \
            core/modules/projects/projects-renderer.mjs
          do
            test -s "/tmp/kernel-gh-pages/${path}"
          done

          grep -q 'kernel-members-patch.js' /tmp/kernel-gh-pages/index.html
          grep -q 'kernel-stats-patch.js' /tmp/kernel-gh-pages/index.html
          grep -q 'kernel-phase1-patch.js' /tmp/kernel-gh-pages/index.html
          grep -q 'kernel-phase1-fix.js' /tmp/kernel-gh-pages/index.html
          grep -q 'kernel-i18n-full.js' /tmp/kernel-gh-pages/index.html
          grep -q 'core/data/publications.v2.json' /tmp/kernel-gh-pages/publicaciones.html

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/kernel-gh-pages')
          researchers = json.loads((root / 'core/data/researchers.v2.json').read_text(encoding='utf-8'))
          publications = json.loads((root / 'core/data/publications.v2.json').read_text(encoding='utf-8'))
          projects = json.loads((root / 'core/data/projects.v2.json').read_text(encoding='utf-8'))
          assert researchers.get('group', {}).get('member_count') == 9
          ids = {item.get('id') for item in researchers.get('researchers', [])}
          assert {'alicia-cordero', 'juan-torregrosa'} <= ids
          assert publications.get('summary', {}).get('unique_records') == 162
          assert len(publications.get('records', [])) == 162
          assert projects.get('summary', {}).get('featured_approved_projects') == 10
          print('SPA-compatible data verified: 9 researchers, 162 publications, 10 featured projects.')
          PY

          cd /tmp/kernel-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore SPA integrations and Kernel Core catalogs"
            git push origin HEAD:gh-pages
          fi
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the exact published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" | tee pages-settings.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" | tee pages-build-request.json
          for attempt in $(seq 1 72); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            printf '%s\n' "$payload" > pages-build-latest.json
            status=$(printf '%s' "$payload" | jq -r '.status // ""')
            commit=$(printf '%s' "$payload" | jq -r '.commit // ""')
            echo "Attempt ${attempt}: status=${status} commit=${commit} expected=${PUBLISHED_SHA}"
            if [ "$status" = "built" ] && [ "$commit" = "$PUBLISHED_SHA" ]; then
              exit 0
            fi
            if [ "$status" = "errored" ] && [ "$commit" = "$PUBLISHED_SHA" ]; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Install Playwright
        run: |
          mkdir -p /tmp/kernel-spa-smoke
          cd /tmp/kernel-spa-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1 >/dev/null
          npx playwright install --with-deps chromium

      - name: Create SPA-aware browser verification
        run: |
          mkdir -p smoke-artifacts
          cat > /tmp/kernel-spa-smoke/smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const base = 'https://www.grupoelkernel.com';
          const cacheKey = process.env.CACHE_KEY;
          const output = path.join(process.env.GITHUB_WORKSPACE, 'smoke-artifacts');
          await fs.mkdir(output, { recursive: true });
          const report = { base, cacheKey, passed: false, checks: [], failures: [] };
          const assets = [
            'assets/kernel-members-patch.js','assets/kernel-stats-patch.js','assets/kernel-phase1-patch.js',
            'assets/kernel-phase1-fix.js','assets/kernel-i18n-full.js','assets/alicia-cordero-photo.svg',
            'assets/juan-torregrosa-photo.svg','miguel.jpg','core/data/researchers.v2.json',
            'core/data/publications.v2.json','core/data/projects.v2.json'
          ];

          async function check(name, fn) {
            try { await fn(); report.checks.push({name, passed:true}); console.log(`PASS ${name}`); }
            catch (error) { const message = error?.stack || String(error); report.checks.push({name, passed:false, error:message}); report.failures.push(`${name}: ${message}`); console.error(`FAIL ${name}\n${message}`); }
          }

          for (const asset of assets) await check(`asset ${asset}`, async () => {
            const response = await fetch(`${base}/${asset}?smoke=${encodeURIComponent(cacheKey)}`, { headers: {'cache-control':'no-cache, no-store', pragma:'no-cache'} });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            if ((await response.arrayBuffer()).byteLength < 8) throw new Error('empty file');
          });

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1440,height:1050}, locale:'es-DO'});
          const page = await context.newPage();
          let localErrors = [];
          page.on('response', response => { try { const u=new URL(response.url()); if (u.origin===base && response.status()>=400) localErrors.push(`${response.status()} ${u.pathname}`); } catch {} });
          page.on('requestfailed', request => { try { const u=new URL(request.url()); if (u.origin===base) localErrors.push(`FAILED ${u.pathname}`); } catch {} });

          async function route(name) {
            localErrors=[];
            await page.goto(`${base}/?smoke=${encodeURIComponent(cacheKey)}#/${name}`, {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForSelector('body', {timeout:30000});
            await page.waitForTimeout(2500);
          }

          await check('SPA Equipo con 9 integrantes e internacionales', async () => {
            await route('equipment');
            await page.waitForSelector('#kernel-international-members', {timeout:30000});
            await page.waitForFunction(() => document.body.innerText.includes('Alicia Cordero') && document.body.innerText.includes('Juan Ramón Torregrosa'), null, {timeout:30000});
            const text=await page.locator('body').innerText();
            if (!/9\s+investigadores/i.test(text)) throw new Error('missing 9 researchers metric');
            await page.waitForSelector('#kernel-language-switch', {timeout:30000});
            if (localErrors.length) throw new Error(localErrors.join(', '));
            await page.screenshot({path:path.join(output,'equipment-desktop.png'),fullPage:true});
          });

          await check('Cambio completo ES/EN', async () => {
            await page.locator('#kernel-language-switch').click();
            await page.waitForFunction(() => document.documentElement.lang==='en', null, {timeout:10000});
            const text=await page.locator('body').innerText();
            if (!/(Research team|International researchers|Team)/i.test(text)) throw new Error('English content not detected');
            await page.locator('#kernel-language-switch').click();
            await page.waitForFunction(() => document.documentElement.lang==='es', null, {timeout:10000});
          });

          await check('SPA Formación Académica incluye Alicia y Juan Ramón', async () => {
            await route('formacionacademica');
            await page.waitForSelector('[data-kernel-academic="alicia-cordero"]', {timeout:30000});
            await page.waitForSelector('[data-kernel-academic="juan-torregrosa"]', {timeout:30000});
            if (localErrors.length) throw new Error(localErrors.join(', '));
            await page.screenshot({path:path.join(output,'academic-desktop.png'),fullPage:true});
          });

          await check('SPA Publicaciones integra autores internacionales y 572+', async () => {
            await route('publicaciones');
            await page.waitForSelector('#kernel-international-author-group', {timeout:30000});
            const text=await page.locator('body').innerText();
            if (!text.includes('Alicia Cordero') || !text.includes('Juan Ramón Torregrosa')) throw new Error('international authors missing');
            if (!text.includes('572+')) throw new Error('572+ metric missing');
            if (localErrors.length) throw new Error(localErrors.join(', '));
            await page.screenshot({path:path.join(output,'spa-publications-desktop.png'),fullPage:true});
          });

          await check('Publicaciones 2.0 carga 162 registros', async () => {
            localErrors=[];
            await page.goto(`${base}/publicaciones.html?smoke=${encodeURIComponent(cacheKey)}`, {waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(() => document.querySelector('#statTotal')?.textContent?.trim()==='162', null, {timeout:30000});
            await page.waitForFunction(() => document.querySelectorAll('.publication-card').length>=100, null, {timeout:30000});
            if (localErrors.length) throw new Error(localErrors.join(', '));
            await page.screenshot({path:path.join(output,'publications-2-desktop.png'),fullPage:true});
          });

          await check('Proyectos carga 10 destacados', async () => {
            localErrors=[];
            await page.goto(`${base}/proyectos.html?smoke=${encodeURIComponent(cacheKey)}`, {waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(() => document.querySelector('#featuredProjects')?.textContent?.trim()==='10', null, {timeout:30000});
            await page.waitForFunction(() => document.querySelectorAll('.project-card').length>0, null, {timeout:30000});
            if (localErrors.length) throw new Error(localErrors.join(', '));
            await page.screenshot({path:path.join(output,'projects-desktop.png'),fullPage:true});
          });

          await check('Equipo móvil sin desbordamiento horizontal', async () => {
            const mobile=await context.newPage();
            await mobile.setViewportSize({width:390,height:844});
            await mobile.goto(`${base}/?smoke=${encodeURIComponent(cacheKey)}#/equipment`, {waitUntil:'domcontentloaded',timeout:60000});
            await mobile.waitForFunction(() => document.body.innerText.includes('Alicia Cordero') && document.body.innerText.includes('Juan Ramón Torregrosa'), null, {timeout:30000});
            const dimensions=await mobile.evaluate(() => ({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
            if (dimensions.scroll>dimensions.client+4) throw new Error(JSON.stringify(dimensions));
            await mobile.screenshot({path:path.join(output,'equipment-mobile.png'),fullPage:true});
            await mobile.close();
          });

          await browser.close();
          report.passed=report.failures.length===0;
          await fs.writeFile(path.join(output,'spa-smoke-report.json'),JSON.stringify(report,null,2));
          if (!report.passed) { console.error(JSON.stringify(report,null,2)); process.exit(1); }
          console.log('FINAL SPA-COMPATIBLE PUBLIC SMOKE PASS');
          JS

      - name: Run first browser verification
        env:
          CACHE_KEY: ${{ env.PUBLISHED_SHA }}
        run: |
          cd /tmp/kernel-spa-smoke
          node smoke.mjs

      - name: Finalize published branch and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/kernel-gh-pages
          python - <<'PY'
          import os
          from pathlib import Path
          path=Path('deployment-version.txt')
          text=path.read_text(encoding='utf-8') if path.exists() else 'Kernel Core public activation\n'
          lines=[line for line in text.splitlines() if not line.startswith('spa_compatible_sha=')]
          lines.append(f"spa_compatible_sha={os.environ['PUBLISHED_SHA']}")
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git add deployment-version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record SPA-compatible final activation"
            git push origin HEAD:gh-pages
          fi
          echo "FINAL_GH_PAGES_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > "$GITHUB_WORKSPACE/pages-final-build-request.json"
          for attempt in $(seq 1 72); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            printf '%s\n' "$payload" > "$GITHUB_WORKSPACE/pages-final-build-latest.json"
            status=$(printf '%s' "$payload" | jq -r '.status // ""')
            commit=$(printf '%s' "$payload" | jq -r '.commit // ""')
            echo "Final attempt ${attempt}: status=${status} commit=${commit} expected=${FINAL_GH_PAGES_SHA}"
            if [ "$status" = "built" ] && [ "$commit" = "$FINAL_GH_PAGES_SHA" ]; then
              exit 0
            fi
            if [ "$status" = "errored" ] && [ "$commit" = "$FINAL_GH_PAGES_SHA" ]; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Run final browser verification
        env:
          CACHE_KEY: ${{ env.FINAL_GH_PAGES_SHA }}
        run: |
          rm -rf smoke-artifacts/final
          mkdir -p smoke-artifacts/final
          cd /tmp/kernel-spa-smoke
          node smoke.mjs
          cp -R "$GITHUB_WORKSPACE/smoke-artifacts" "$GITHUB_WORKSPACE/smoke-artifacts/final-copy" || true

      - name: Write final activation report
        run: |
          cat > core/activation/FINAL_SPA_ACTIVATION_REPORT.md <<EOF
          # Activación pública final compatible con la SPA

          Fecha: 2026-07-25

          - PR de activación base: #25.
          - Commit de fusión en main: \`6376165ad672554e16c53bab1610edb8793526bd\`.
          - Revisión SPA publicada: \`${PUBLISHED_SHA}\`.
          - Revisión final de gh-pages: \`${FINAL_GH_PAGES_SHA}\`.
          - Fuente de GitHub Pages: rama \`gh-pages\`, ruta \`/\`.
          - Se preservó la portada moderna, Servicios, Laboratorio, Investigación y la navegación SPA.
          - Se restauraron los módulos de Equipo, Formación Académica, traducción ES/EN y métricas globales.
          - Se validaron 9 investigadores, Alicia Cordero y Juan Ramón Torregrosa, 162 publicaciones y 10 proyectos destacados.
          - La fotografía institucional actualizada de Miguel permanece en \`miguel.jpg\`.
          - Smoke test Playwright en escritorio y móvil: PASS.

          ## Reversión

          - main previo: \`ddbbae2abd68d1ecb35165b0721116c779fe7375\`.
          - gh-pages previo: \`0a86f78a26ebbffe4862208ab6f5ee627b973366\`.
          - Ramas: \`rollback/main-pre-reactivation-20260725\` y \`rollback/gh-pages-pre-reactivation-20260725\`.
          EOF

      - name: Upload final activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-final-spa-activation-evidence
          path: |
            smoke-artifacts/**
            pages-settings.json
            pages-build-request.json
            pages-build-latest.json
            pages-final-build-request.json
            pages-final-build-latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist report and remove one-time controls
        run: |
          rm -f core/activation/.spa-compatible-activation-trigger
          rm -f .github/workflows/kernel-spa-compatible-activation.yml
          rm -f .github/workflows/fix-publications-v2-public.yml
          rm -f .github/workflows/sync-publications-v2-to-pages.yml
          rm -f core/activation/.publications-v2-fix-trigger
          rm -f core/activation/.publications-v2-pages-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A core/activation/FINAL_SPA_ACTIVATION_REPORT.md core/activation/.spa-compatible-activation-trigger .github/workflows/kernel-spa-compatible-activation.yml .github/workflows/fix-publications-v2-public.yml .github/workflows/sync-publications-v2-to-pages.yml core/activation/.publications-v2-fix-trigger core/activation/.publications-v2-pages-trigger
          git commit -m "Record successful SPA-compatible public activation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
