name: Live UI and Language Verification

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/live-ui-i18n-verification]
    paths:
      - '.github/workflows/live-ui-i18n-verification.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - '.github/workflows/live-ui-i18n-verification.yml'

permissions:
  contents: read

jobs:
  verify-live:
    name: Verify public palette and bilingual interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Inspect deployed public interface
        env:
          LIVE_BASE_URL: https://www.grupoelkernel.com
          LIVE_RESULT_DIR: live-ui-i18n-verification
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import traceback
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = os.environ['LIVE_BASE_URL'].rstrip('/')
          out = Path(os.environ['LIVE_RESULT_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          report = {
              'base_url': base,
              'script_versions': {},
              'checks': {},
              'failures': [],
              'exception': None,
          }

          options = Options()
          for argument in [
              '--headless=new',
              '--no-sandbox',
              '--disable-gpu',
              '--disable-dev-shm-usage',
              '--window-size=1440,1800',
          ]:
              options.add_argument(argument)
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(120)
          wait = WebDriverWait(driver, 90)

          def save() -> None:
              (out / 'result.json').write_text(
                  json.dumps(report, indent=2, ensure_ascii=False),
                  encoding='utf-8',
              )

          def record(name: str, condition: bool, detail=None) -> None:
              report['checks'][name] = {'ok': bool(condition), 'detail': detail}
              if not condition:
                  report['failures'].append(name)
              print(('PASS' if condition else 'FAIL') + ': ' + name + (f' — {detail}' if detail is not None else ''))
              save()

          def body_text() -> str:
              return driver.execute_script("return (document.body.innerText || '').replace(/\\s+/g,' ').trim()")

          def set_language(language: str) -> None:
              driver.execute_script(
                  """
                  const lang = arguments[0];
                  localStorage.setItem('kernel-language', lang);
                  localStorage.setItem('language', lang);
                  localStorage.setItem('lang', lang);
                  document.documentElement.lang = lang;
                  window.dispatchEvent(new CustomEvent('kernel-language-change', {detail:{language:lang}}));
                  document.dispatchEvent(new CustomEvent('kernel-language-change', {detail:{language:lang}}));
                  """,
                  language,
              )

          def apply_layers() -> None:
              driver.execute_script(
                  """
                  window.KernelUiI18nUnification?.apply?.();
                  window.KernelUiI18nFinalizer?.apply?.();
                  window.KernelUiI18nWatchdog?.apply?.();
                  window.KernelSiteChromeLanguageFix?.apply?.();
                  window.KernelTeamLanguageFix?.apply?.();
                  window.KernelToolsEnglishContent?.apply?.();
                  window.KernelNameDegreeFix?.apply?.();
                  window.KernelSpanishRestoration?.apply?.();
                  """
              )

          def open_route(route: str, language: str = 'en', selector: str | None = None, expected: str | None = None) -> None:
              cache = int(time.time() * 1000)
              driver.get(f'{base}/?verify={cache}#/{route}')
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
              wait.until(
                  lambda d: d.execute_script(
                      "return Boolean(window.KernelUiI18nUnification && window.KernelUiI18nFinalizer && window.KernelSpanishRestoration && window.KernelSiteChromeLanguageFix && window.KernelTeamLanguageFix && window.KernelNameDegreeFix)"
                  )
              )
              wait.until(
                  lambda d: d.execute_script(
                      "return window.KernelUiI18nUnification?.diagnostics().translations >= 590 && window.KernelUiI18nFinalizer?.diagnostics().translations >= 590"
                  )
              )
              set_language(language)
              if selector:
                  wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, selector))
              apply_layers()
              if expected:
                  WebDriverWait(driver, 30).until(lambda d: expected.lower() in body_text().lower())
              time.sleep(1.1)
              apply_layers()
              time.sleep(0.35)

          def background(selector: str) -> str:
              return driver.execute_script(
                  "const e=document.querySelector(arguments[0]); return e ? getComputedStyle(e).backgroundColor : '';",
                  selector,
              )

          try:
              open_route('home', 'en', '[data-kernel-platform-page="home-2b"]', 'Research and scientific services')
              report['script_versions'] = driver.execute_script(
                  """
                  return {
                    unification: window.KernelUiI18nUnification?.version || null,
                    finalizer: window.KernelUiI18nFinalizer?.version || null,
                    spanishRestoration: window.KernelSpanishRestoration?.version || null,
                    teamLanguage: window.KernelTeamLanguageFix?.version || null,
                    degreeFix: window.KernelNameDegreeFix?.version || null,
                    tabState: window.KernelToolsTabStateFix?.version || null
                  };
                  """
              )
              header_text = driver.find_element(By.ID, 'header').text
              footer_text = driver.find_element(By.ID, 'footer').text
              record('Public deployment loads the new language layers', all(report['script_versions'].values()), report['script_versions'])
              record('Home header is fully English', 'Research and scientific services' in header_text and 'Investigación y servicios científicos' not in header_text, header_text)
              record('Footer copyright is English', 'All rights reserved' in footer_text, footer_text[-320:])
              driver.save_screenshot(str(out / 'home-live-english.png'))

              open_route('servicios', 'en', '#main button[aria-pressed="true"]', 'Institutional catalog of professional and academic services')
              services = body_text()
              record('Services page is English', 'Institutional catalog of professional and academic services' in services and 'Catálogo institucional de servicios' not in services)
              record('Active service filter uses institutional teal', background('#main button[aria-pressed="true"]') == 'rgb(15, 91, 93)', background('#main button[aria-pressed="true"]'))
              driver.save_screenshot(str(out / 'services-live-english.png'))

              open_route('herramientas', 'en', '#tab-xmera', 'Academic Tools')
              record('Tools page is English', 'Academic Tools' in body_text() and 'Herramientas Académicas' not in body_text())
              record('Xmera tab is initially institutional teal', background('#tab-xmera') == 'rgb(15, 91, 93)', background('#tab-xmera'))
              banner = driver.find_element(By.ID, 'tab-banner')
              driver.execute_script('arguments[0].click()', banner)
              WebDriverWait(driver, 10).until(lambda d: banner.get_attribute('aria-selected') == 'true')
              WebDriverWait(driver, 20).until(lambda d: 'Grade Publishing Generator' in body_text())
              time.sleep(0.7)
              record('Banner tab becomes institutional teal', background('#tab-banner') == 'rgb(15, 91, 93)', background('#tab-banner'))
              record('Xmera tab becomes white when inactive', background('#tab-xmera') == 'rgb(255, 255, 255)', background('#tab-xmera'))
              record('Banner content is English', 'Grade Publishing Generator' in body_text() and 'Generador de Publicaciones de Calificaciones' not in body_text())
              driver.save_screenshot(str(out / 'tools-banner-live-english.png'))

              open_route('laboratorioKernel', 'en', '#kernel-login', 'Sign in')
              laboratory = body_text()
              record('Laboratory access is English', all(value in laboratory for value in ['Protected area', 'Email address', 'Password', 'Sign in']) and 'Iniciar sesión' not in laboratory)
              record('Laboratory primary action uses institutional teal', background("#kernel-login button[type='submit']") == 'rgb(15, 91, 93)', background("#kernel-login button[type='submit']"))
              driver.save_screenshot(str(out / 'laboratory-live-english.png'))

              open_route('quienesSomos', 'en', None, 'Who we are')
              about = body_text()
              old_hero_hidden = driver.execute_script(
                  "const e=document.querySelector('[data-kernel-legacy-who-hero]'); return e && getComputedStyle(e).display === 'none';"
              )
              record('Who we are page is English', 'Who we are' in about and 'Nuestro compromiso institucional' not in about)
              record('Legacy duplicated hero remains hidden', bool(old_hero_hidden))
              driver.save_screenshot(str(out / 'about-live-english.png'))

              open_route('equipment', 'en', '.kernel-team-core__card', 'Researcher in numerical methods, PDEs, and mathematics education')
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '.kernel-team-core__card')) == 9)
              apply_layers()
              time.sleep(1.5)
              cards = driver.find_elements(By.CSS_SELECTOR, '.kernel-team-core__card')
              headings = [card.find_element(By.CSS_SELECTOR, 'h2').text for card in cards]
              duplicate_degrees = [heading for heading in headings if len(re.findall(r'(?:Ph\.D\.|M\.Sc\.)', heading)) > 1]
              jose_heading = next((heading for heading in headings if heading.startswith('Jose Alberto Reyes Reyes')), '')
              record('Nine researcher cards are visible', len(cards) == 9, headings)
              record('Researcher roles are English', 'Researcher in numerical methods, PDEs, and mathematics education' in body_text() and 'Investigador en métodos numéricos' not in body_text())
              record('Academic degrees are not duplicated', not duplicate_degrees, duplicate_degrees)
              record('Jose degree appears exactly once', jose_heading.count('Ph.D.') == 1, jose_heading)

              profile_ids = driver.execute_script("return [...document.querySelectorAll('[data-kernel-team-open]')].map(button => button.dataset.kernelTeamOpen)")
              opened_profiles = []
              for profile_id in profile_ids:
                  button_selector = f'[data-kernel-team-open="{profile_id}"]'
                  driver.execute_script("document.querySelector(arguments[0])?.click()", button_selector)
                  panel_selector = f'[data-kernel-profile-panel="{profile_id}"]'
                  WebDriverWait(driver, 25).until(lambda d, selector=panel_selector: d.find_elements(By.CSS_SELECTOR, selector))
                  apply_layers()
                  time.sleep(0.35)
                  heading = driver.find_element(By.CSS_SELECTOR, panel_selector + ' h2').text
                  degree_count = len(re.findall(r'(?:Ph\.D\.|M\.Sc\.)', heading))
                  opened_profiles.append({'id': profile_id, 'heading': heading, 'degree_count': degree_count})
                  driver.execute_script("document.querySelector('[data-kernel-team-profile-back]')?.click()")
                  WebDriverWait(driver, 20).until(lambda d: not d.find_elements(By.CSS_SELECTOR, '[data-kernel-profile-panel]'))
              record('All nine complete profiles open and close', len(opened_profiles) == 9, opened_profiles)
              record('Profile headings contain no repeated degrees', all(item['degree_count'] <= 1 for item in opened_profiles), opened_profiles)
              driver.save_screenshot(str(out / 'team-live-english.png'))

              open_route('lineas', 'en', '.lineas-shell', "The group's scientific work areas")
              line_background = driver.execute_script(
                  "const e=document.querySelector('[data-kernel-line-card].kernel-line-active'); return e ? getComputedStyle(e).backgroundImage : '';"
              )
              record('Research lines are English', "The group's scientific work areas" in body_text() and 'Áreas de trabajo científico del grupo' not in body_text())
              record('Selected research line uses the institutional gradient', '15, 91, 93' in line_background and '85, 128, 193' not in line_background, line_background)
              driver.save_screenshot(str(out / 'research-lines-live-english.png'))

              open_route('proyectos', 'en', '.kernel-project-card', 'The 58 participations do not necessarily represent 58 unique projects')
              record('Projects page is English', 'The 58 participations do not necessarily represent 58 unique projects' in body_text() and 'Las 58 participaciones no equivalen' not in body_text())
              driver.save_screenshot(str(out / 'projects-live-english.png'))

              open_route('publicaciones', 'en', '.kernel-publication-card', 'El Kernel publications')
              record('Publications page is English', 'El Kernel publications' in body_text() and 'Producción científica verificable' not in body_text())
              driver.save_screenshot(str(out / 'publications-live-english.png'))

              open_route('diagnosticoServicios', 'es', 'form', 'Cuéntenos qué necesita resolver')
              spanish = body_text()
              record('Spanish is restored after English navigation', 'Cuéntenos qué necesita resolver' in spanish and 'Tell us what you need to solve' not in spanish, spanish[:500])
              driver.save_screenshot(str(out / 'diagnostic-live-spanish.png'))

              driver.set_window_size(390, 844)
              open_route('herramientas', 'en', '#tab-xmera', 'Academic Tools')
              record('Institutional active tab remains teal on mobile', background('#tab-xmera') == 'rgb(15, 91, 93)', background('#tab-xmera'))
              driver.save_screenshot(str(out / 'tools-live-mobile.png'))

              severe = [
                  entry for entry in driver.get_log('browser')
                  if entry.get('level') == 'SEVERE' and 'favicon' not in entry.get('message', '').lower()
              ]
              record('No severe JavaScript errors on the public site', not severe, severe)

          except Exception as error:  # noqa: BLE001
              report['exception'] = {
                  'type': type(error).__name__,
                  'message': str(error),
                  'traceback': traceback.format_exc(),
                  'url': driver.current_url,
              }
              report['failures'].append('exception')
              save()
              try:
                  driver.save_screenshot(str(out / 'exception.png'))
              except Exception:
                  pass
          finally:
              save()
              driver.quit()

          print(json.dumps(report, indent=2, ensure_ascii=False))
          if report['failures']:
              raise SystemExit('Live verification failures: ' + ', '.join(dict.fromkeys(report['failures'])))
          PY

      - name: Upload public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-i18n-verification
          path: live-ui-i18n-verification/
          if-no-files-found: error
          retention-days: 7
