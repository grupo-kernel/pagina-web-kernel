name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - El-Kernel-2.0

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate calculators, methodology and protected routes
        run: npm run test:all

      - name: Build Tailwind CSS
        run: npx tailwindcss -i ./src/css/style.css -o ./src/css/output.css

      - name: Build project with Vite
        run: npm run build

      - name: Import authoritative homepage resources
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1
          mkdir -p dist/assets dist/core/data
          git show origin/gh-pages:assets/kernel-home-2b-bridge.js \
            > dist/assets/kernel-home-2b-bridge.js
          for file in researchers.v2.json publications.v2.json projects.v2.json; do
            git show "origin/gh-pages:core/data/$file" \
              > "dist/core/data/$file"
          done

      - name: Generate synchronous homepage snapshot
        run: node scripts/generate-home-snapshot.mjs

      - name: Fix the home bridge at its source
        run: node scripts/patch-home-bridge.mjs

      - name: Prepare complete production entry point
        run: node scripts/prepare-gh-pages-index.mjs

      - name: Finalize analytics and first-entry loading
        run: node scripts/finalize-analytics-entry.mjs

      - name: Finalize persistent blue featured tools
        run: node scripts/finalize-featured-tools-blue.mjs

      - name: Activate interpretation and reporting tools
        run: node scripts/activate-lab-interpret-report.mjs

      - name: Finalize automated Analytics exclusion
        run: node scripts/finalize-analytics-automation.mjs

      - name: Finalize registered Ker(F) identity
        run: node scripts/finalize-kerf-brand.mjs

      - name: Validate generated route chunks
        run: npm run test:dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          cname: www.grupoelkernel.com

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps webkit

      - name: Verify first entry without reloading or homepage data requests
        env:
          KERNEL_BASE_URL: https://www.grupoelkernel.com
          KERNEL_DEPLOYMENT: source-${{ github.sha }}
        run: |
          export KERNEL_DEPLOYMENT="source-$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          node scripts/smoke-home-first-entry.mjs
