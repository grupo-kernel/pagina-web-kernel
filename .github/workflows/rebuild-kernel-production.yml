name: Rebuild integrated Kernel production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-kernel-production.yml'
      - 'core/activation/.integrated-production-trigger'

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: kernel-integrated-production
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Rebuild integrated Kernel production'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Kernel Core sources
        run: |
          set -euo pipefail
          node core/run-quality-gate.mjs
          node core/validate-team-integration.mjs
          node core/validate-academic-integration.mjs
          node core/validate-publications-module.mjs
          node core/validate-projects-module.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          researchers = json.loads(Path('core/data/researchers.v2.json').read_text(encoding='utf-8'))
          publications = json.loads(Path('core/data/publications.v2.json').read_text(encoding='utf-8'))
          projects = json.loads(Path('core/data/projects.v2.json').read_text(encoding='utf-8'))
          assert researchers['group']['member_count'] == 9
          ids = {item['id'] for item in researchers['researchers']}
          assert {'alicia-cordero', 'juan-torregrosa'} <= ids
          assert publications['summary']['unique_records'] == 162
          assert len(publications['records']) == 162
          assert projects['summary']['featured_approved_projects'] == 10
          print('Validated: 9 researchers, 162 publications and 10 featured projects.')
          PY

      - name: Assemble selective SPA-compatible production tree
        run: |
          set -euo pipefail
          SOURCE_MAIN_SHA=$(git rev-parse HEAD)
          echo "SOURCE_MAIN_SHA=${SOURCE_MAIN_SHA}" >> "$GITHUB_ENV"

          git fetch origin gh-pages
          STABLE_GH_PAGES_SHA=$(git rev-parse origin/gh-pages)
          echo "STABLE_GH_PAGES_SHA=${STABLE_GH_PAGES_SHA}" >> "$GITHUB_ENV"

          rm -rf /tmp/kernel-production
          git worktree add --detach /tmp/kernel-production origin/gh-pages
          PROD=/tmp/kernel-production

          for page in quienes_somos.html equipo.html formacion.html lineas.html proyectos.html publicaciones.html noticias.html contacto.html; do
            cp -f "$page" "$PROD/$page"
          done

          mkdir -p "$PROD/core/data" "$PROD/core/modules" "$PROD/assets/css" "$PROD/assets/img" "$PROD/translations"
          cp -f core/data/*.json "$PROD/core/data/"
          for module in team academic scientific-profiles publications projects; do
            rm -rf "$PROD/core/modules/$module"
            cp -a "core/modules/$module" "$PROD/core/modules/$module"
          done
          cp -f assets/css/kernel.css "$PROD/assets/css/kernel.css"
          if [ -d assets/img ]; then cp -af assets/img/. "$PROD/assets/img/"; fi
          cp -af translations/. "$PROD/translations/"

          cp -f assets/kernel-miguel-photo-patch.js "$PROD/assets/kernel-miguel-photo-patch.js"
          for file in ElKernel.png miguel.jpg natanael.jpg randy.jpg antmel.jpg antmel_rodriguez.jpg marino.png marckelly.jpg josealberto.jpg; do
            if [ -f "$file" ]; then cp -f "$file" "$PROD/$file"; fi
          done

          rm -f "$PROD/.github/workflows/restore-kernel-spa-assets.yml"
          rm -f "$PROD/restore-kernel-spa-assets-trigger.txt"

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/kernel-production/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'kernel-miguel-photo-patch.js?v=20260725-1'
          if marker not in text:
              anchor = '"kernel-i18n-full.js?v=20260725-1"'
              if anchor in text:
                  text = text.replace(anchor, anchor + ',\n                "' + marker + '"', 1)
              elif '</body>' in text:
                  text = text.replace('</body>', '<script defer="defer" src="assets/' + marker + '"></script></body>', 1)
              else:
                  raise SystemExit('No se pudo insertar el parche de fotografía de Miguel en index.html.')
          path.write_text(text, encoding='utf-8')
          PY

          cat > "$PROD/deployment-version.txt" <<EOF
          Kernel integrated public activation
          source_merge_sha=6376165ad672554e16c53bab1610edb8793526bd
          source_main_sha=${SOURCE_MAIN_SHA}
          stable_gh_pages_base=${STABLE_GH_PAGES_SHA}
          architecture=stable-spa-plus-kernel-core
          researchers=9
          publications_unique=162
          career_publications=572+
          featured_projects=10
          activated_at=2026-07-25
          EOF

          test -s "$PROD/index.html"
          test -s "$PROD/assets/index-BEtvhqLu.js"
          test -s "$PROD/assets/index-DDHYSPOT.css"
          for asset in kernel-members-patch.js kernel-stats-patch.js kernel-phase1-patch.js kernel-phase1-fix.js kernel-i18n-full.js kernel-miguel-photo-patch.js; do
            test -s "$PROD/assets/$asset"
          done
          grep -q 'kernel-members-patch.js' "$PROD/index.html"
          grep -q 'kernel-stats-patch.js' "$PROD/index.html"
          grep -q 'kernel-phase1-patch.js' "$PROD/index.html"
          grep -q 'kernel-phase1-fix.js' "$PROD/index.html"
          grep -q 'kernel-i18n-full.js' "$PROD/index.html"
          grep -q 'kernel-miguel-photo-patch.js' "$PROD/index.html"
          test -s "$PROD/miguel.jpg"
          test -s "$PROD/core/data/researchers.v2.json"
          test -s "$PROD/core/data/publications.v2.json"
          test -s "$PROD/core/data/projects.v2.json"
          grep -q 'core/data/publications.v2.json' "$PROD/publicaciones.html"
          grep -q 'core/data/projects.v2.json' "$PROD/proyectos.html"

      - name: Publish integrated production branch
        id: publish
        run: |
          set -euo pipefail
          cd /tmp/kernel-production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy integrated Kernel SPA and Kernel Core"
          fi
          if ! git push origin HEAD:gh-pages; then
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          fi
          PRODUCTION_SHA=$(git rev-parse HEAD)
          echo "PRODUCTION_SHA=${PRODUCTION_SHA}" >> "$GITHUB_ENV"
          echo "Published gh-pages revision ${PRODUCTION_SHA}"

      - name: Wait for successful GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" | tee pages-settings.json
          requested=0
          last_failed_id=""
          success_id=""

          for attempt in $(seq 1 120); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=gh-pages&per_page=50")
            run=$(printf '%s' "$payload" | jq --arg sha "$PRODUCTION_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.name | ascii_downcase) == "pages build and deployment")] | sort_by(.created_at) | last // empty')

            if [ -n "$run" ]; then
              id=$(printf '%s' "$run" | jq -r '.id')
              status=$(printf '%s' "$run" | jq -r '.status')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
              echo "Attempt ${attempt}: run=${id} status=${status} conclusion=${conclusion} sha=${PRODUCTION_SHA}"

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                success_id="$id"
                break
              fi

              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ] && [ "$id" != "$last_failed_id" ] && [ "$requested" -lt 2 ]; then
                last_failed_id="$id"
                requested=$((requested + 1))
                echo "Pages run ${id} ended as ${conclusion}; requesting retry ${requested}."
                gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > "pages-build-request-${requested}.json" || true
                sleep 15
              fi
            else
              echo "Attempt ${attempt}: waiting for automatic Pages run for ${PRODUCTION_SHA}."
              if { [ "$attempt" -eq 8 ] || [ "$attempt" -eq 30 ]; } && [ "$requested" -lt 2 ]; then
                requested=$((requested + 1))
                gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > "pages-build-request-${requested}.json" || true
              fi
            fi
            sleep 10
          done

          if [ -z "$success_id" ]; then
            echo "No successful Pages deployment was observed for ${PRODUCTION_SHA}."
            exit 1
          fi

          echo "PAGES_RUN_ID=${success_id}" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${success_id}" > pages-run.json
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" > pages-build-latest.json

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Run final integrated browser smoke test
        run: |
          set -euo pipefail
          rm -rf smoke-artifacts
          mkdir -p smoke-artifacts
          passed=0
          for attempt in 1 2 3 4 5; do
            echo "Browser smoke attempt ${attempt}."
            if BASE_URL="https://www.grupoelkernel.com" \
               CACHE_KEY="${PRODUCTION_SHA}-${attempt}" \
               SMOKE_OUTPUT="$GITHUB_WORKSPACE/smoke-artifacts" \
               node scripts/integrated_public_smoke.mjs; then
              passed=1
              break
            fi
            sleep 20
          done
          test "$passed" -eq 1

      - name: Roll back public branch after any deployment or smoke failure
        if: failure() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Restoring stable gh-pages revision ${STABLE_GH_PAGES_SHA}."
          git push origin "${STABLE_GH_PAGES_SHA}:gh-pages" --force
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > rollback-pages-build-request.json || true
          rollback_id=""
          for attempt in $(seq 1 90); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=gh-pages&per_page=50")
            run=$(printf '%s' "$payload" | jq --arg sha "$STABLE_GH_PAGES_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.name | ascii_downcase) == "pages build and deployment")] | sort_by(.created_at) | last // empty')
            if [ -n "$run" ]; then
              id=$(printf '%s' "$run" | jq -r '.id')
              status=$(printf '%s' "$run" | jq -r '.status')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
              echo "Rollback attempt ${attempt}: run=${id} status=${status} conclusion=${conclusion}"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                rollback_id="$id"
                break
              fi
            fi
            sleep 10
          done
          if [ -n "$rollback_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rollback_id}" > rollback-pages-run.json
            echo "Stable public site restored successfully."
          else
            echo "The branch was restored, but a successful Pages rebuild was not observed within the timeout."
          fi

      - name: Upload final activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-final-integrated-activation-evidence
          path: |
            pages-settings.json
            pages-run.json
            pages-build-latest.json
            pages-build-request-*.json
            rollback-pages-build-request.json
            rollback-pages-run.json
            smoke-artifacts/**
          if-no-files-found: warn
          retention-days: 30

      - name: Record successful final activation and remove one-time controls
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p core/activation
          cat > core/activation/final-public-deployment.json <<EOF
          {
            "status": "active",
            "architecture": "stable-spa-plus-kernel-core",
            "activation_pr": 25,
            "activation_merge_sha": "6376165ad672554e16c53bab1610edb8793526bd",
            "source_main_sha": "${SOURCE_MAIN_SHA}",
            "production_sha": "${PRODUCTION_SHA}",
            "pages_run_id": ${PAGES_RUN_ID},
            "pages_build": "success",
            "browser_smoke": "pass",
            "researchers": 9,
            "publications_unique": 162,
            "career_publications": "572+",
            "featured_projects": 10,
            "activated_at": "2026-07-25"
          }
          EOF
          cat > core/activation/FINAL_PUBLIC_ACTIVATION_REPORT.md <<EOF
          # Activación pública final del Grupo El Kernel

          - Arquitectura: SPA estable más módulos Kernel Core.
          - PR de activación: #25.
          - Commit de fusión: \`6376165ad672554e16c53bab1610edb8793526bd\`.
          - Fuente main usada: \`${SOURCE_MAIN_SHA}\`.
          - Revisión publicada en gh-pages: \`${PRODUCTION_SHA}\`.
          - GitHub Pages run: \`${PAGES_RUN_ID}\` (success).
          - Smoke test Playwright en escritorio y móvil: PASS.
          - Se preservaron Servicios, Laboratorio Inteligente, herramientas, menús, autenticación y navegación SPA.
          - Se activaron 9 investigadores, Alicia Cordero y Juan Ramón Torregrosa, la nueva foto de Miguel, 162 publicaciones únicas, 572+ artículos acumulados y 10 proyectos aprobados destacados.
          - El formulario de contacto conserva Formspree; no se envió ningún mensaje de prueba.

          ## Reversión disponible

          - main previo: \`ddbbae2abd68d1ecb35165b0721116c779fe7375\`.
          - gh-pages previo: \`${STABLE_GH_PAGES_SHA}\`.
          - ramas: \`rollback/main-pre-reactivation-20260725\` y \`rollback/gh-pages-pre-reactivation-20260725\`.
          EOF

          rm -f core/activation/.integrated-production-trigger
          rm -f .github/workflows/rebuild-kernel-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A core/activation/final-public-deployment.json core/activation/FINAL_PUBLIC_ACTIVATION_REPORT.md core/activation/.integrated-production-trigger .github/workflows/rebuild-kernel-production.yml
          git commit -m "Record successful final public activation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
