name: Live Antmel Project Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/live-antmel-project-state]
    paths:
      - '.github/workflows/live-antmel-project-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium requests
      - name: Inspect public deployment and project route
        run: |
          mkdir -p live-antmel-project-diagnostic
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import traceback
          from pathlib import Path

          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          BASE = 'https://www.grupoelkernel.com'
          OUT = Path('live-antmel-project-diagnostic')
          report = {'http': {}, 'browser': {}, 'exception': None}

          try:
              response = requests.get(BASE + '/?antmel_diag=' + str(int(time.time() * 1000)), timeout=30)
              report['http'] = {
                  'status': response.status_code,
                  'url': response.url,
                  'length': len(response.text),
                  'has_script_v3': 'kernel-antmel-approved-project-definitive.js?v=20260727-3' in response.text,
                  'has_script_any': 'kernel-antmel-approved-project-definitive.js' in response.text,
                  'has_59_literal': '59 participaciones' in response.text,
              }
              (OUT / 'live-index.html').write_text(response.text, encoding='utf-8')
          except Exception as exc:
              report['http'] = {'error': f'{type(exc).__name__}: {exc}'}

          options = Options()
          for argument in [
              '--headless=new', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage',
              '--window-size=430,1800'
          ]:
              options.add_argument(argument)
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL', 'performance': 'ALL'})
          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(120)
          wait = WebDriverWait(driver, 90)

          def snapshot(label: str):
              data = driver.execute_script(r"""
                const normalize=v=>String(v||'').replace(/\s+/g,' ').trim();
                const controls=[...document.querySelectorAll('#main input,#main select')].map((e,i)=>({
                  i,tag:e.tagName.toLowerCase(),type:e.type||'',value:e.value,
                  placeholder:e.getAttribute('placeholder')||'',
                  aria:e.getAttribute('aria-label')||'',
                  selected:e.selectedOptions?.[0]?.textContent?.trim()||'',
                  parent:normalize(e.parentElement?.innerText).slice(0,220)
                }));
                const cards=[...document.querySelectorAll('#main .kernel-project-card')].map((card,i)=>({
                  i,id:card.dataset.kernelProjectId||'',
                  antmel:card.dataset.kernelAntmelApproved||'',
                  title:normalize(card.querySelector('h2,h3')?.textContent),
                  display:getComputedStyle(card).display,
                  parentClass:typeof card.parentElement?.className==='string'?card.parentElement.className:'',
                  rect:{x:card.getBoundingClientRect().x,y:card.getBoundingClientRect().y,w:card.getBoundingClientRect().width,h:card.getBoundingClientRect().height}
                }));
                const allText=normalize(document.getElementById('main')?.innerText);
                return {
                  url:location.href,
                  route:location.hash,
                  ready:document.readyState,
                  moduleExists:Boolean(window.KernelAntmelApprovedProjectDefinitive),
                  moduleVersion:window.KernelAntmelApprovedProjectDefinitive?.version||null,
                  projectId:window.KernelAntmelApprovedProjectDefinitive?.projectId||null,
                  scriptSources:[...document.scripts].map(s=>s.src).filter(src=>src.includes('kernel-antmel-approved-project-definitive')),
                  controls,cards,
                  resultHeadings:[...document.querySelectorAll('#main h2,#main h3,#main p')].map(e=>normalize(e.textContent)).filter(t=>/resultados|results|participaciones|proyectos aprobados/i.test(t)).slice(0,30),
                  textHasTitle:allText.includes('Análisis dinámico y estabilidad de métodos iterativos sin Jacobiana'),
                  textHasAmount:allText.includes('1,286,178.40'),
                  textHasEmpty:allText.includes('No hay proyectos que coincidan') || allText.includes('No projects match'),
                  mainText:allText.slice(0,6000),
                  mainHtml:document.getElementById('main')?.innerHTML||''
                };
              """)
              report['browser'][label] = data
              (OUT / f'{label}-main.html').write_text(data.get('mainHtml',''), encoding='utf-8')
              driver.save_screenshot(str(OUT / f'{label}.png'))
              return data

          try:
              driver.get(BASE + '/?antmel_diag=' + str(int(time.time() * 1000)) + '#/proyectos')
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
              wait.until(lambda d: d.find_elements(By.ID, 'main'))
              time.sleep(4)
              before = snapshot('before_filters')

              # Set the filters exactly as shown by the user.
              controls = driver.find_elements(By.CSS_SELECTOR, '#main input, #main select')
              search = next((e for e in controls if e.tag_name == 'input'), None)
              selects = [e for e in controls if e.tag_name == 'select']
              if search is not None:
                  driver.execute_script("arguments[0].value='Análisis dinámico y estabilidad de métodos'; arguments[0].dispatchEvent(new Event('input',{bubbles:true})); arguments[0].dispatchEvent(new Event('change',{bubbles:true}));", search)
              for select in selects:
                  options_text = [o.text.strip() for o in select.find_elements(By.TAG_NAME, 'option')]
                  if any('Aprobado' == text or 'Approved' == text for text in options_text):
                      driver.execute_script("const s=arguments[0]; const o=[...s.options].find(o=>/^(Aprobado|Approved)$/.test(o.text.trim())); if(o){s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));}", select)
                  if any('Antmel Rodríguez Cabral' in text for text in options_text):
                      driver.execute_script("const s=arguments[0]; const o=[...s.options].find(o=>o.text.includes('Antmel Rodríguez Cabral')); if(o){s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));}", select)
              time.sleep(2)
              after_filters = snapshot('after_filters')

              manual_result = driver.execute_script("try { window.KernelAntmelApprovedProjectDefinitive?.apply?.(); return {ok:true}; } catch(e){ return {ok:false,error:String(e),stack:e.stack}; }")
              report['browser']['manual_apply_result'] = manual_result
              time.sleep(1)
              after_manual = snapshot('after_manual_apply')

              report['browser']['console'] = driver.get_log('browser')
          except Exception as exc:
              report['exception'] = {
                  'type': type(exc).__name__, 'message': str(exc),
                  'traceback': traceback.format_exc(), 'url': driver.current_url,
              }
              try:
                  driver.save_screenshot(str(OUT / 'exception.png'))
              except Exception:
                  pass
          finally:
              driver.quit()

          (OUT / 'result.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-antmel-project-diagnostic
          path: live-antmel-project-diagnostic/
          if-no-files-found: error
          retention-days: 7
