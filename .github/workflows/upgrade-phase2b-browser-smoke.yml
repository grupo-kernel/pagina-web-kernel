name: Upgrade Phase 2B browser smoke test

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'platform/.upgrade-browser-smoke-trigger'
      - '.github/workflows/upgrade-phase2b-browser-smoke.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Upgrade Phase 2B browser smoke test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Replace dump-dom smoke test with Selenium
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/kernel-platform-integration-gate.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '      - name: Browser smoke test preserved and integrated routes\n'
          end_marker = '      - name: Upload browser diagnostic\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the existing browser smoke block.')
          replacement = '''      - name: Install Selenium for functional tests
        run: python3 -m pip install --disable-pip-version-check selenium
      - name: Functional browser smoke test
        env:
          BASE_URL: http://127.0.0.1:4174
          BROWSER_RESULT: ci-browser/browser-smoke-result.json
        run: |
          mkdir -p ci-browser
          python3 -m http.server 4174 >/tmp/kernel-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          python3 platform/browser_smoke_test.py
'''
          text = text[:start] + replacement + text[end:]
          old = '          if [ -f ci-browser/result.txt ]; then cp ci-browser/result.txt ci-results/platform-browser-smoke.log; else printf \'Browser smoke test did not complete.\\n\' > ci-results/platform-browser-smoke.log; fi'
          new = '          if [ -f ci-browser/browser-smoke-result.json ]; then cp ci-browser/browser-smoke-result.json ci-results/platform-browser-smoke.log; else printf \'Browser smoke test did not complete.\\n\' > ci-results/platform-browser-smoke.log; fi'
          if old not in text:
              raise SystemExit('Could not locate the browser result persistence line.')
          text = text.replace(old, new, 1)
          old_syntax = '          node --check platform/validate-institutional-tools.mjs\n'
          new_syntax = old_syntax + '          python3 -m py_compile platform/browser_smoke_test.py\n'
          if old_syntax not in text:
              raise SystemExit('Could not locate the syntax-check insertion point.')
          text = text.replace(old_syntax, new_syntax, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f platform/.upgrade-browser-smoke-trigger
          rm -f .github/workflows/upgrade-phase2b-browser-smoke.yml
      - name: Commit functional smoke test workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/kernel-platform-integration-gate.yml platform/.upgrade-browser-smoke-trigger .github/workflows/upgrade-phase2b-browser-smoke.yml
          git commit -m "Use functional browser tests for Xmera Banner and Laboratory"
          git push origin HEAD:fase-2b-platform-integration
