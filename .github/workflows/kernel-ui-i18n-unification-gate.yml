name: Kernel UI and English Unification Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/ui-i18n-unification]
    paths:
      - 'index.html'
      - 'assets/kernel-i18n-full.js'
      - 'assets/kernel-name-degree-fix.js'
      - 'assets/kernel-ui-i18n-unification.js'
      - 'assets/kernel-ui-i18n-finalizer.js'
      - 'assets/kernel-ui-i18n-watchdog.js'
      - 'assets/kernel-tools-english-content.js'
      - 'assets/kernel-tools-tab-state-fix.js'
      - 'assets/kernel-site-chrome-language-fix.js'
      - 'assets/kernel-team-language-fix.js'
      - 'assets/kernel-spanish-restoration.js'
      - 'assets/kernel-researcher-photo-source-stability.js'
      - 'assets/i18n/kernel-ui-en-*.json'
      - 'platform/test_ui_i18n_unification.py'
      - 'platform/test_ui_i18n_unification_v2.py'
      - '.github/workflows/kernel-ui-i18n-unification-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/kernel-i18n-full.js'
      - 'assets/kernel-name-degree-fix.js'
      - 'assets/kernel-ui-i18n-unification.js'
      - 'assets/kernel-ui-i18n-finalizer.js'
      - 'assets/kernel-ui-i18n-watchdog.js'
      - 'assets/kernel-tools-english-content.js'
      - 'assets/kernel-tools-tab-state-fix.js'
      - 'assets/kernel-site-chrome-language-fix.js'
      - 'assets/kernel-team-language-fix.js'
      - 'assets/kernel-spanish-restoration.js'
      - 'assets/kernel-researcher-photo-source-stability.js'
      - 'assets/i18n/kernel-ui-en-*.json'
      - 'platform/test_ui_i18n_unification.py'
      - 'platform/test_ui_i18n_unification_v2.py'
      - '.github/workflows/kernel-ui-i18n-unification-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate institutional palette and English coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate assets
        run: |
          node --check assets/kernel-i18n-full.js
          node --check assets/kernel-name-degree-fix.js
          node --check assets/kernel-ui-i18n-unification.js
          node --check assets/kernel-ui-i18n-finalizer.js
          node --check assets/kernel-ui-i18n-watchdog.js
          node --check assets/kernel-tools-english-content.js
          node --check assets/kernel-tools-tab-state-fix.js
          node --check assets/kernel-site-chrome-language-fix.js
          node --check assets/kernel-team-language-fix.js
          node --check assets/kernel-spanish-restoration.js
          node --check assets/kernel-researcher-photo-source-stability.js
          python -m py_compile platform/test_ui_i18n_unification.py
          python -m py_compile platform/test_ui_i18n_unification_v2.py
          python - <<'PY'
          import json
          from pathlib import Path

          total = 0
          for path in sorted(Path('assets/i18n').glob('kernel-ui-en-*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(data, dict) and data, path
              total += len(data)

          index = Path('index.html').read_text(encoding='utf-8')
          assert total >= 615, total
          required = [
              'kernel-i18n-full.js',
              'kernel-name-degree-fix.js',
              'kernel-ui-i18n-unification.js',
              'kernel-ui-i18n-finalizer.js',
              'kernel-ui-i18n-watchdog.js',
              'kernel-tools-english-content.js',
              'kernel-tools-tab-state-fix.js',
              'kernel-site-chrome-language-fix.js',
              'kernel-team-language-fix.js',
              'kernel-spanish-restoration.js',
              'kernel-researcher-photo-source-stability.js',
          ]
          for asset in required:
              assert asset in index, asset
          print({'translations': total, 'assets': len(required)})
          PY

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Start controlled preview
        run: |
          python -m http.server 4191 >/tmp/kernel-ui-i18n-http.log 2>&1 &
          echo $! >/tmp/kernel-ui-i18n-http.pid
          sleep 2

      - name: Run browser regression
        env:
          BASE_URL: http://127.0.0.1:4191
          UI_I18N_RESULT_DIR: ci-ui-i18n
        run: |
          set -o pipefail
          python platform/test_ui_i18n_unification_v2.py 2>&1 | tee /tmp/kernel-ui-i18n-test.log

      - name: Stop controlled preview
        if: always()
        run: |
          if [ -f /tmp/kernel-ui-i18n-http.pid ]; then kill "$(cat /tmp/kernel-ui-i18n-http.pid)" || true; fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ui-i18n-unification-result
          path: |
            ci-ui-i18n/
            /tmp/kernel-ui-i18n-test.log
            /tmp/kernel-ui-i18n-http.log
          if-no-files-found: warn
          retention-days: 7
