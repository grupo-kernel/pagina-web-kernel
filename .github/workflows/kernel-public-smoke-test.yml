name: Kernel Public Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kernel-public-smoke-test.yml'
      - 'scripts/public_smoke_test.py'
      - 'core/activation/.public-smoke-trigger'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-public-smoke-test.yml'
      - 'scripts/public_smoke_test.py'
      - 'core/activation/.public-smoke-trigger'

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live public site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run external public smoke test
        env:
          BASE_URL: https://www.grupoelkernel.com
          CACHE_KEY: ${{ github.sha }}
          SMOKE_ATTEMPTS: '3'
          SMOKE_DELAY_SECONDS: '20'
          SMOKE_RESULT: public-smoke-result.json
        run: python scripts/public_smoke_test.py
      - name: Upload public smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-public-smoke-result
          path: public-smoke-result.json
          if-no-files-found: warn
          retention-days: 14
