name: Live UI and Language Verification Continuation v2

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/live-ui-i18n-verification]
    paths:
      - '.github/workflows/live-ui-i18n-continuation-v2.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - '.github/workflows/live-ui-i18n-continuation-v2.yml'

permissions:
  contents: read

jobs:
  verify-live-continuation-v2:
    name: Verify all public profiles and remaining bilingual pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Run stable continuation verification
        env:
          LIVE_BASE_URL: https://www.grupoelkernel.com
          LIVE_RESULT_DIR: live-ui-i18n-continuation-v2
        run: |
          mkdir -p "$LIVE_RESULT_DIR"
          cat > /tmp/live_continuation_v2.py <<'PY'
          import json
          import os
          import re
          import time
          import traceback
          from pathlib import Path
          from urllib.parse import quote

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = os.environ['LIVE_BASE_URL'].rstrip('/')
          out = Path(os.environ['LIVE_RESULT_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          report = {'base_url': base, 'checks': {}, 'failures': [], 'exception': None}

          options = Options()
          for argument in ['--headless=new', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage', '--window-size=1440,1800']:
              options.add_argument(argument)
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(120)
          wait = WebDriverWait(driver, 90)

          def save():
              (out / 'result.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')

          def record(name, condition, detail=None):
              report['checks'][name] = {'ok': bool(condition), 'detail': detail}
              if not condition:
                  report['failures'].append(name)
              print(('PASS' if condition else 'FAIL') + ': ' + name)
              save()

          def body_text():
              return driver.execute_script("return (document.body.innerText || '').replace(/\\s+/g,' ').trim()")

          def set_language(language):
              driver.execute_script(
                  """
                  const lang=arguments[0];
                  localStorage.setItem('kernel-language',lang);
                  localStorage.setItem('language',lang);
                  localStorage.setItem('lang',lang);
                  document.documentElement.lang=lang;
                  window.dispatchEvent(new CustomEvent('kernel-language-change',{detail:{language:lang}}));
                  document.dispatchEvent(new CustomEvent('kernel-language-change',{detail:{language:lang}}));
                  """,
                  language,
              )

          def wait_layers():
              wait.until(lambda d: d.execute_script(
                  "return Boolean(window.KernelUiI18nUnification && window.KernelUiI18nFinalizer && window.KernelSpanishRestoration && window.KernelTeamLanguageFix && window.KernelNameDegreeFix)"
              ))
              wait.until(lambda d: d.execute_script(
                  "return window.KernelUiI18nUnification.diagnostics().translations >= 590 && window.KernelUiI18nFinalizer.diagnostics().translations >= 590"
              ))

          def apply_layers():
              driver.execute_script(
                  """
                  window.KernelUiI18nUnification?.apply?.();
                  window.KernelUiI18nFinalizer?.apply?.();
                  window.KernelUiI18nWatchdog?.apply?.();
                  window.KernelSiteChromeLanguageFix?.apply?.();
                  window.KernelTeamLanguageFix?.apply?.();
                  window.KernelToolsEnglishContent?.apply?.();
                  window.KernelNameDegreeFix?.apply?.();
                  window.KernelSpanishRestoration?.apply?.();
                  """
              )

          def open_route(route, language, selector, expected, extra_query=''):
              cache = str(int(time.time() * 1000))
              query = '?verify=' + cache
              if extra_query:
                  query += '&' + extra_query
              driver.get(base + '/' + query + '#/' + route)
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
              wait_layers()
              set_language(language)
              wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, selector))
              apply_layers()
              WebDriverWait(driver, 35).until(lambda d: expected.lower() in body_text().lower())
              time.sleep(1.0)
              apply_layers()
              time.sleep(0.35)

          def background(selector):
              return driver.execute_script(
                  "const e=document.querySelector(arguments[0]);return e?getComputedStyle(e).backgroundColor:'';",
                  selector,
              )

          try:
              open_route('equipment', 'en', '.kernel-team-core__card', 'Researcher in numerical methods, PDEs, and mathematics education')
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '.kernel-team-core__card')) == 9)
              headings = driver.execute_script(
                  "return [...document.querySelectorAll('.kernel-team-core__card h2')].map(h=>h.textContent.replace(/\\s+/g,' ').trim())"
              )
              duplicates = [heading for heading in headings if len(re.findall(r'(?:Ph\.D\.|M\.Sc\.)', heading)) > 1]
              jose_heading = next((heading for heading in headings if heading.startswith('Jose Alberto Reyes Reyes')), '')
              record('Nine researcher cards are visible', len(headings) == 9, headings)
              record('Researcher roles are English', 'Researcher in numerical methods, PDEs, and mathematics education' in body_text() and 'Investigador en métodos numéricos' not in body_text())
              record('Card degrees are not duplicated', not duplicates, duplicates)
              record('Jose degree appears once', jose_heading.count('Ph.D.') == 1, jose_heading)
              driver.save_screenshot(str(out / 'team-cards-live-english.png'))

              profile_ids = driver.execute_script(
                  "return [...document.querySelectorAll('[data-kernel-team-open]')].map(b=>b.dataset.kernelTeamOpen)"
              )
              profiles = []
              for profile_id in profile_ids:
                  open_route(
                      'equipment',
                      'en',
                      '[data-kernel-profile-panel="' + profile_id + '"]',
                      'Education',
                      'kernelProfile=' + quote(profile_id),
                  )
                  panel_selector = '[data-kernel-profile-panel="' + profile_id + '"]'
                  heading = driver.execute_script(
                      "const h=document.querySelector(arguments[0]+' h2');return h?h.textContent.replace(/\\s+/g,' ').trim():'';",
                      panel_selector,
                  )
                  sections = driver.execute_script(
                      "return [...document.querySelectorAll(arguments[0]+' h3')].map(h=>h.textContent.trim());",
                      panel_selector,
                  )
                  profiles.append({
                      'id': profile_id,
                      'heading': heading,
                      'sections': sections,
                      'degree_count': len(re.findall(r'(?:Ph\.D\.|M\.Sc\.)', heading)),
                  })

              record('All nine complete public profiles load', len(profiles) == 9, profiles)
              record('Profile headings avoid repeated degrees', all(item['degree_count'] <= 1 for item in profiles), profiles)
              record('Profile section labels are English', all('Education' in item['sections'] and 'Experience' in item['sections'] for item in profiles), profiles)
              driver.save_screenshot(str(out / 'last-profile-live-english.png'))

              open_route('lineas', 'en', '.lineas-shell', "The group's scientific work areas")
              line_background = driver.execute_script(
                  "const e=document.querySelector('[data-kernel-line-card].kernel-line-active');return e?getComputedStyle(e).backgroundImage:'';"
              )
              record('Research lines are English', "The group's scientific work areas" in body_text() and 'Áreas de trabajo científico del grupo' not in body_text())
              record('Selected research line uses institutional gradient', '15, 91, 93' in line_background and '85, 128, 193' not in line_background, line_background)
              driver.save_screenshot(str(out / 'research-lines-live-english.png'))

              open_route('proyectos', 'en', '.kernel-project-card', 'The 58 participations do not necessarily represent 58 unique projects')
              record('Projects are English', 'The 58 participations do not necessarily represent 58 unique projects' in body_text() and 'Las 58 participaciones no equivalen' not in body_text())
              driver.save_screenshot(str(out / 'projects-live-english.png'))

              open_route('publicaciones', 'en', '.kernel-publication-card', 'El Kernel publications')
              record('Publications are English', 'El Kernel publications' in body_text() and 'Producción científica verificable' not in body_text())
              driver.save_screenshot(str(out / 'publications-live-english.png'))

              open_route('diagnosticoServicios', 'es', 'form', 'Cuéntenos qué necesita resolver')
              spanish = body_text()
              record('Spanish is restored after English navigation', 'Cuéntenos qué necesita resolver' in spanish and 'Tell us what you need to solve' not in spanish, spanish[:500])
              driver.save_screenshot(str(out / 'diagnostic-live-spanish.png'))

              driver.set_window_size(390, 844)
              open_route('herramientas', 'en', '#tab-xmera', 'Academic Tools')
              record('Active tool tab remains teal on mobile', background('#tab-xmera') == 'rgb(15, 91, 93)', background('#tab-xmera'))
              driver.save_screenshot(str(out / 'tools-live-mobile.png'))

              severe = [
                  entry for entry in driver.get_log('browser')
                  if entry.get('level') == 'SEVERE' and 'favicon' not in entry.get('message', '').lower()
              ]
              record('No severe JavaScript errors', not severe, severe)

          except Exception as error:
              report['exception'] = {
                  'type': type(error).__name__,
                  'message': str(error),
                  'traceback': traceback.format_exc(),
                  'url': driver.current_url,
              }
              report['failures'].append('exception')
              save()
              try:
                  driver.save_screenshot(str(out / 'exception.png'))
              except Exception:
                  pass
          finally:
              save()
              driver.quit()

          print(json.dumps(report, indent=2, ensure_ascii=False))
          if report['failures']:
              raise SystemExit('Live continuation v2 failures: ' + ', '.join(dict.fromkeys(report['failures'])))
          PY
          python -m py_compile /tmp/live_continuation_v2.py
          python /tmp/live_continuation_v2.py

      - name: Upload stable continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-i18n-continuation-v2
          path: live-ui-i18n-continuation-v2/
          if-no-files-found: error
          retention-days: 7
