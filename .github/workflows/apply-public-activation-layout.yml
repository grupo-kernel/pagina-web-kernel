name: Apply Public Activation Layout

on:
  push:
    branches: [fase-2a-public-reactivation]
    paths:
      - 'scripts/apply-public-activation-layout.py'
      - 'core/activation/layout.part*'
      - '.github/workflows/apply-public-activation-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage public activation layout corrections'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v4
        with:
          ref: fase-2a-public-reactivation
      - name: Apply reviewed page corrections
        run: python scripts/apply-public-activation-layout.py
      - name: Commit integrated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lineas.html proyectos.html contacto.html noticias.html equipo.html formacion.html \
            core/modules/projects/projects-renderer.mjs \
            core/modules/projects/preview.html \
            core/modules/projects/projects.css
          git diff --cached --quiet && exit 0
          git commit -m "Integrate public activation layout"
          git push origin HEAD:fase-2a-public-reactivation
