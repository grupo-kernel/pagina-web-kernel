name: Phase 2B bilingual menu correction

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - '.github/workflows/phase2b-i18n-menu-fix.yml'
      - 'platform/.i18n-menu-trigger'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply Phase 2B bilingual menu fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Keep the Formación menu label synchronized with the selected language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/kernel-platform-bridge.js')
          text = path.read_text(encoding='utf-8')
          old = '''    const panel = document.getElementById("submenu-nosotros");
    if (!panel || panel.querySelector('[data-kernel-route="formacion"]')) return;
    const reference = panel.querySelector("button[data-route]");'''
          new = '''    const panel = document.getElementById("submenu-nosotros");
    if (!panel) return;
    const existing = panel.querySelector('[data-kernel-route="formacion"]');
    if (existing) {
      const existingLabel = existing.querySelector("span");
      if (existingLabel) existingLabel.textContent = labels().menu;
      return;
    }
    const reference = panel.querySelector("button[data-route]");'''
          if old not in text:
              raise SystemExit('Expected Formación menu block not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check assets/kernel-platform-bridge.js
          rm -f platform/.i18n-menu-trigger
          rm -f .github/workflows/phase2b-i18n-menu-fix.yml
      - name: Commit bilingual menu correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/kernel-platform-bridge.js platform/.i18n-menu-trigger .github/workflows/phase2b-i18n-menu-fix.yml
          git commit -m "Apply Phase 2B bilingual menu fix"
          git push origin HEAD:fase-2b-platform-integration
