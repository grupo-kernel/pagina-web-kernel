name: Diagnose iOS direct-link loading

on:
  pull_request:
    branches:
      - El-Kernel-2.0
    paths:
      - .github/workflows/diagnose-ios-direct-link.yml

permissions:
  contents: read

jobs:
  ios-direct-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps webkit

      - name: Test cold direct entry with stalled institutional data
        shell: bash
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');

          (async () => {
            const browser = await webkit.launch({ headless: true });
            const context = await browser.newContext({
              ...devices['iPhone 13'],
              locale: 'es-DO'
            });

            await context.route(/\/core\/data\/(researchers|publications|projects)\.v2\.json(?:\?.*)?$/, async route => {
              await new Promise(resolve => setTimeout(resolve, 7000));
              await route.continue();
            });

            const page = await context.newPage();
            const messages = [];
            page.on('console', message => messages.push(`${message.type()}: ${message.text()}`));
            page.on('pageerror', error => messages.push(`pageerror: ${error.stack || error.message}`));
            page.on('requestfailed', request => messages.push(`failed: ${request.url()} :: ${request.failure()?.errorText}`));

            const startedAt = Date.now();
            await page.goto(`https://www.grupoelkernel.com/?ios-direct-test=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });
            await page.waitForTimeout(4800);

            const result = await page.evaluate(() => ({
              href: location.href,
              deployment: document.querySelector('meta[name="kernel-deployment"]')?.content || null,
              loading: Boolean(document.querySelector('.kernel-home-2b__loading')),
              ready: Boolean(document.querySelector('[data-kernel-platform-page="home-2b"]')),
              title: document.querySelector('.kernel-home-2b__hero h1')?.textContent?.replace(/\s+/g, ' ').trim() || null,
              diagnostics: window.KernelHomeDirectEntryFix?.diagnostics?.() || null,
              bodyText: document.body.innerText.slice(0, 700)
            }));

            result.elapsedMs = Date.now() - startedAt;
            console.log('IOS DIRECT-LINK RESULT');
            console.log(JSON.stringify(result, null, 2));
            console.log('MESSAGES');
            console.log(messages.join('\n'));

            await page.screenshot({ path: '/tmp/kernel-ios-direct-link.png', fullPage: true });

            if (!result.ready) throw new Error('The integrated homepage did not render on a cold direct entry.');
            if (result.loading) throw new Error('The loading placeholder remained visible.');
            if (!result.diagnostics) throw new Error('The direct-entry safeguard did not initialize.');
            if ((result.diagnostics.fallbacksUsed || []).length < 3) {
              throw new Error('The controlled stalled requests did not activate all safe fallbacks.');
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload iPhone screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ios-direct-link
          path: /tmp/kernel-ios-direct-link.png
          if-no-files-found: ignore
