name: Kernel Affiliations Projects Language Stability Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/native-antmel-project-cache-fix]
    paths:
      - 'index.html'
      - 'core/data/projects.v2.json'
      - 'assets/kernel-data-affiliations-projects-fix.js'
      - 'assets/kernel-institutional-history-project-fix.js'
      - 'assets/kernel-evaluation-project-details.js'
      - 'assets/kernel-project-native-stability-fix.js'
      - 'assets/kernel-lab-news-language.js'
      - 'assets/kernel-lab-news-partial-fix.js'
      - 'assets/kernel-stable-language.js'
      - 'assets/kernel-i18n-full.js'
      - 'assets/kernel-ui-i18n-unification.js'
      - 'assets/kernel-ui-i18n-finalizer.js'
      - 'assets/kernel-ui-i18n-watchdog.js'
      - 'assets/kernel-tools-english-content.js'
      - 'assets/kernel-site-chrome-language-fix.js'
      - 'assets/kernel-spanish-restoration.js'
      - 'platform/test_affiliations_projects_lab_news_stability.py'
      - 'platform/test_native_antmel_project.py'
      - '.github/workflows/kernel-affiliations-projects-language-stability-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'core/data/projects.v2.json'
      - 'assets/kernel-data-affiliations-projects-fix.js'
      - 'assets/kernel-institutional-history-project-fix.js'
      - 'assets/kernel-evaluation-project-details.js'
      - 'assets/kernel-project-native-stability-fix.js'
      - 'assets/kernel-lab-news-language.js'
      - 'assets/kernel-lab-news-partial-fix.js'
      - 'assets/kernel-stable-language.js'
      - 'assets/kernel-i18n-full.js'
      - 'assets/kernel-ui-i18n-unification.js'
      - 'assets/kernel-ui-i18n-finalizer.js'
      - 'assets/kernel-ui-i18n-watchdog.js'
      - 'assets/kernel-tools-english-content.js'
      - 'assets/kernel-site-chrome-language-fix.js'
      - 'assets/kernel-spanish-restoration.js'
      - 'platform/test_affiliations_projects_lab_news_stability.py'
      - 'platform/test_native_antmel_project.py'
      - '.github/workflows/kernel-affiliations-projects-language-stability-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate native Antmel project, bilingual content and stability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source files and project catalog
        run: |
          node --check assets/kernel-data-affiliations-projects-fix.js
          node --check assets/kernel-institutional-history-project-fix.js
          node --check assets/kernel-evaluation-project-details.js
          node --check assets/kernel-project-native-stability-fix.js
          node --check assets/kernel-lab-news-language.js
          node --check assets/kernel-lab-news-partial-fix.js
          node --check assets/kernel-stable-language.js
          node --check assets/kernel-i18n-full.js
          node --check assets/kernel-ui-i18n-unification.js
          node --check assets/kernel-ui-i18n-finalizer.js
          node --check assets/kernel-ui-i18n-watchdog.js
          node --check assets/kernel-tools-english-content.js
          node --check assets/kernel-site-chrome-language-fix.js
          node --check assets/kernel-spanish-restoration.js
          python -m py_compile platform/test_affiliations_projects_lab_news_stability.py
          python -m py_compile platform/test_native_antmel_project.py
          python - <<'PY'
          import json
          from pathlib import Path

          projects = json.loads(Path('core/data/projects.v2.json').read_text(encoding='utf-8'))
          summary = projects['summary']
          assert summary['recorded_participations'] == 59, summary
          assert summary['featured_approved_projects'] == 11, summary
          assert summary['proposals_under_review'] == 2, summary

          approved = {item['id']: item for item in projects.get('approved_projects', [])}
          antmel = approved['uasd-dinamica-sin-jacobiana']
          assert antmel['status'] == 'approved'
          assert antmel['featured'] is True
          assert antmel['member_ids'] == ['antmel-rodriguez']
          assert antmel['institution'] == 'Universidad Autónoma de Santo Domingo (UASD)'
          assert antmel['funding']['amount'] == 1286178.40
          assert antmel['dates'] == {'start': '2026-01', 'end': '2027-06'}

          proposals = {item['id']: item for item in projects.get('proposals', [])}
          optimization = proposals['fondocyt-optimizacion-hibrida-redes-econometria']
          assert optimization['member_ids'] == ['miguel-leonardo', 'natanael-urena', 'antmel-rodriguez']
          assert optimization['external_collaborators'] == ['Alicia Cordero Barbero', 'Juan Ramón Torregrosa Sánchez']

          index = Path('index.html').read_text(encoding='utf-8')
          assert 'kernel-deployment" content="20260727-native-antmel-2' in index
          assert 'kernel_build' in index
          assert 'kernel-data-affiliations-projects-fix.js?v=20260727-8' in index
          assert 'kernel-project-native-stability-fix.js?v=20260727-1' in index
          assert 'index-BEtvhqLu.js?v=20260727-native-antmel-2' in index
          assert 'index-DDHYSPOT.css?v=20260727-native-antmel-2' in index
          assert 'kernel-antmel-approved-project-definitive.js' not in index
          assert not Path('assets/kernel-antmel-approved-project-definitive.js').exists()
          print({'approved_projects': 11, 'antmel_native': True, 'cache_busted': True, 'stable_details': True})
          PY

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Start controlled preview
        run: |
          python -m http.server 4199 >/tmp/kernel-native-antmel-http.log 2>&1 &
          echo $! >/tmp/kernel-native-antmel-http.pid
          sleep 2

      - name: Verify the native approved project and all filters
        env:
          BASE_URL: http://127.0.0.1:4199
          NATIVE_PROJECT_RESULT_DIR: ci-native-antmel-project
        run: |
          set -o pipefail
          python platform/test_native_antmel_project.py 2>&1 | tee /tmp/kernel-native-antmel-test.log

      - name: Run integrated bilingual regression
        env:
          BASE_URL: http://127.0.0.1:4199
          RESULT_DIR: ci-affiliations-projects-lab-news
        run: |
          set -o pipefail
          python platform/test_affiliations_projects_lab_news_stability.py 2>&1 | tee /tmp/kernel-affiliations-language-test.log

      - name: Stop controlled preview
        if: always()
        run: |
          if [ -f /tmp/kernel-native-antmel-http.pid ]; then kill "$(cat /tmp/kernel-native-antmel-http.pid)" || true; fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-native-antmel-project-result
          path: |
            ci-native-antmel-project/
            ci-affiliations-projects-lab-news/
            /tmp/kernel-native-antmel-test.log
            /tmp/kernel-affiliations-language-test.log
            /tmp/kernel-native-antmel-http.log
          if-no-files-found: warn
          retention-days: 7
