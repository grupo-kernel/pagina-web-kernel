    <script>
        (function asegurarVersionKernel() {
            const version = "20260728-laboratory-background-2";
            const parametro = "kernel_build";
            const marca = `kernel-build-${version}`;
            const url = new URL(window.location.href);

            if (
                url.searchParams.get(parametro) ===
                version
            ) {
                sessionStorage.setItem(marca, "1");
                return;
            }

            if (sessionStorage.getItem(marca)) {
                return;
            }

            sessionStorage.setItem(marca, "1");
            url.searchParams.set(parametro, version);
            window.location.replace(url.toString());
        })();
    </script>

    <script>
        (function prepararVistaDeLineas() {
            const root = document.documentElement;
            const attribute = "data-kernel-research-lines-pending";
            const routes = new Set(["research-lines", "lineas", "research"]);

            function route() {
                return window.location.hash
                    .replace(/^#\/?/, "")
                    .split(/[/?]/)
                    .filter(Boolean)[0]
                    ?.toLowerCase() || "";
            }

            function isResearchLinesRoute() {
                const path = window.location.pathname.toLowerCase();
                return routes.has(route()) || /\/lineas(?:\.html)?\/?$/.test(path);
            }

            function synchronize() {
                if (isResearchLinesRoute()) {
                    root.setAttribute(attribute, "true");
                } else {
                    root.removeAttribute(attribute);
                }
            }

            synchronize();
            window.addEventListener("hashchange", synchronize, true);
            window.addEventListener("popstate", synchronize, true);
        })();
    </script>
