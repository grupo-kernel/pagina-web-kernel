name: Normalize Phase 2B academic route

on:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'platform/.normalize-academic-route-trigger'
      - '.github/workflows/normalize-phase2b-academic-route.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'Normalize Phase 2B academic route'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fase-2b-platform-integration
          fetch-depth: 0
      - name: Use the native SPA academic route
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_path = Path('assets/kernel-platform-bridge.js')
          bridge = bridge_path.read_text(encoding='utf-8')
          replacements = [
              ('const FORMATION_ROUTE = "formacion";', 'const FORMATION_ROUTE = "formacionacademica";\n  const FORMATION_ALIASES = new Set(["formacionacademica", "formacion"]);'),
              ('if (currentRoute() !== FORMATION_ROUTE) return;', 'if (!FORMATION_ALIASES.has(currentRoute())) return;'),
              ('if (ticket !== renderTicket || currentRoute() !== FORMATION_ROUTE) return;', 'if (ticket !== renderTicket || !FORMATION_ALIASES.has(currentRoute())) return;'),
              ('if (currentRoute() === FORMATION_ROUTE) {', 'if (FORMATION_ALIASES.has(currentRoute())) {'),
          ]
          for old, new in replacements:
              count = bridge.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}; found {count}.')
              bridge = bridge.replace(old, new, 1)
          bridge_path.write_text(bridge, encoding='utf-8')

          validator_path = Path('platform/validate-platform-integration.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          old = 'FORMATION_ROUTE = "formacion"'
          new = 'FORMATION_ROUTE = "formacionacademica"'
          if validator.count(old) != 1:
              raise SystemExit('Academic route token not found exactly once in validator.')
          validator_path.write_text(validator.replace(old, new, 1), encoding='utf-8')

          workflow_path = Path('.github/workflows/kernel-platform-integration-gate.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = 'dump_route formacion formacion'
          new = 'dump_route formacionacademica formacion'
          if workflow.count(old) != 1:
              raise SystemExit('Browser smoke academic route not found exactly once.')
          workflow_path.write_text(workflow.replace(old, new, 1), encoding='utf-8')

          manifest_path = Path('platform/integration-manifest.v1.json')
          manifest = manifest_path.read_text(encoding='utf-8').replace('"academic-background-route"', '"academic-background-route"')
          manifest_path.write_text(manifest, encoding='utf-8')
          PY
          rm -f platform/.normalize-academic-route-trigger
          rm -f .github/workflows/normalize-phase2b-academic-route.yml
      - name: Commit route correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/kernel-platform-bridge.js platform/validate-platform-integration.mjs .github/workflows/kernel-platform-integration-gate.yml platform/.normalize-academic-route-trigger .github/workflows/normalize-phase2b-academic-route.yml
          git commit -m "Use native SPA route for academic background"
          git push origin HEAD:fase-2b-platform-integration
