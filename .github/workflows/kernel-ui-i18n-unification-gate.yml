name: Kernel UI and English Unification Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/ui-i18n-unification]
    paths:
      - 'index.html'
      - 'assets/kernel-ui-i18n-unification.js'
      - 'assets/i18n/kernel-ui-en-*.json'
      - '.github/workflows/kernel-ui-i18n-unification-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/kernel-ui-i18n-unification.js'
      - 'assets/i18n/kernel-ui-en-*.json'
      - '.github/workflows/kernel-ui-i18n-unification-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate institutional palette and English coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate assets
        run: |
          node --check assets/kernel-ui-i18n-unification.js
          python - <<'PY'
          import json
          from pathlib import Path
          total = 0
          for path in sorted(Path('assets/i18n').glob('kernel-ui-en-*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(data, dict) and data, path
              total += len(data)
          assert total >= 590, total
          assert 'kernel-ui-i18n-unification.js' in Path('index.html').read_text(encoding='utf-8')
          print({'translations': total})
          PY
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Start controlled preview
        run: |
          python -m http.server 4191 >/tmp/kernel-ui-i18n-http.log 2>&1 &
          echo $! >/tmp/kernel-ui-i18n-http.pid
          sleep 2
      - name: Run browser regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = 'http://127.0.0.1:4191'
          out = Path('ci-ui-i18n')
          out.mkdir(exist_ok=True)
          options = Options()
          for arg in ['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=1440,1800']:
              options.add_argument(arg)
          options.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 60)
          report = {'routes': {}, 'failures': []}

          cases = [
              ('home', 'Research and scientific services', 'Investigación y servicios científicos'),
              ('diagnosticoServicios', 'Tell us what you need to solve', 'Cuéntenos qué necesita resolver'),
              ('servicios', 'Institutional catalog of professional and academic services', 'Catálogo institucional de servicios profesionales y académicos'),
              ('herramientas', 'Academic Tools', 'Herramientas Académicas'),
              ('laboratorioKernel', 'Sign in', 'Iniciar sesión'),
              ('quienesSomos', 'Identity, purpose, and way of working', 'Nuestro compromiso institucional'),
              ('equipment', 'Researcher in numerical methods, PDEs, and mathematics education', 'Investigador en métodos numéricos'),
              ('lineas', "The group's scientific work areas", 'Áreas de trabajo científico del grupo'),
              ('proyectos', 'The 58 participations do not necessarily represent 58 unique projects', 'Las 58 participaciones no equivalen'),
              ('publicaciones', 'El Kernel publications', 'Producción científica verificable')
          ]

          def body_text():
              return driver.execute_script("return document.body.innerText.replace(/\\s+/g,' ').trim()")

          try:
              driver.get(base + '/')
              driver.execute_script("localStorage.setItem('kernel-language','en'); localStorage.setItem('language','en'); localStorage.setItem('lang','en');")
              for route, expected, forbidden in cases:
                  driver.get(f'{base}/#/{route}')
                  wait.until(lambda d: d.execute_script("return window.KernelUiI18nUnification?.diagnostics().translations >= 590"))
                  wait.until(lambda d, expected=expected: expected in d.execute_script("return document.body.innerText"))
                  text = body_text()
                  ok = expected in text and forbidden not in text
                  details = {'expected': expected, 'forbidden_present': forbidden in text}

                  if route == 'servicios':
                      active = driver.find_element(By.CSS_SELECTOR, '#main button[aria-pressed="true"]')
                      color = driver.execute_script('return getComputedStyle(arguments[0]).backgroundColor', active)
                      details['active_filter_background'] = color
                      ok = ok and color == 'rgb(15, 91, 93)'
                  elif route == 'herramientas':
                      tab = driver.find_element(By.ID, 'tab-xmera')
                      color = driver.execute_script('return getComputedStyle(arguments[0]).backgroundColor', tab)
                      details['active_tab_background'] = color
                      ok = ok and color == 'rgb(15, 91, 93)'
                  elif route == 'laboratorioKernel':
                      button = next(b for b in driver.find_elements(By.CSS_SELECTOR, '#main button') if 'Sign in' in b.text)
                      color = driver.execute_script('return getComputedStyle(arguments[0]).backgroundColor', button)
                      details['login_background'] = color
                      ok = ok and color == 'rgb(15, 91, 93)'
                  elif route == 'quienesSomos':
                      hidden = driver.execute_script("const e=document.querySelector('[data-kernel-legacy-who-hero]'); return e && getComputedStyle(e).display === 'none';")
                      details['legacy_hero_hidden'] = bool(hidden)
                      ok = ok and bool(hidden)
                  elif route == 'lineas':
                      active = driver.find_element(By.CSS_SELECTOR, '[data-kernel-line-card].kernel-line-active')
                      image = driver.execute_script('return getComputedStyle(arguments[0]).backgroundImage', active)
                      details['active_line_background'] = image
                      ok = ok and '15, 91, 93' in image and '85, 128, 193' not in image

                  report['routes'][route] = {'ok': ok, **details}
                  driver.save_screenshot(str(out / f'{route}-english.png'))
                  if not ok:
                      report['failures'].append(route)

              driver.execute_script("localStorage.setItem('kernel-language','es'); localStorage.setItem('language','es'); localStorage.setItem('lang','es');")
              driver.get(base + '/#/diagnosticoServicios')
              wait.until(lambda d: 'Cuéntenos qué necesita resolver' in d.execute_script("return document.body.innerText"))
              report['spanish_restore'] = True

              severe = [entry for entry in driver.get_log('browser') if entry.get('level') == 'SEVERE' and 'favicon' not in entry.get('message','').lower()]
              report['severe_console'] = severe
              if severe:
                  report['failures'].append('console')
          finally:
              driver.quit()
              (out / 'result.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')

          print(json.dumps(report, indent=2, ensure_ascii=False))
          if report['failures']:
              raise SystemExit('UI/i18n failures: ' + ', '.join(report['failures']))
          PY
      - name: Stop controlled preview
        if: always()
        run: |
          if [ -f /tmp/kernel-ui-i18n-http.pid ]; then kill "$(cat /tmp/kernel-ui-i18n-http.pid)" || true; fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ui-i18n-unification-result
          path: |
            ci-ui-i18n/
            /tmp/kernel-ui-i18n-http.log
          if-no-files-found: warn
          retention-days: 7
