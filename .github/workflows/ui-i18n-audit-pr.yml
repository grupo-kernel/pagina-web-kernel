name: Kernel UI and English Audit PR

on:
  pull_request:
    branches:
      - gh-pages
    paths:
      - .github/workflows/ui-i18n-audit.yml
      - .github/workflows/ui-i18n-audit-pr.yml
      - scripts/ui_i18n_dom_audit.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Execute route summary audit
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import textwrap
          import traceback

          output = Path('ui-i18n-audit')
          output.mkdir(exist_ok=True)
          try:
              source = Path('.github/workflows/ui-i18n-audit.yml').read_text(encoding='utf-8')
              marker = "          python - <<'PY'\n"
              start = source.index(marker) + len(marker)
              end = source.index("\n          PY\n", start)
              script = textwrap.dedent(source[start:end])
              bad = 'driver.execute_script("return [...document.querySelectorAll(\'a[href*="#/"]\')].map(a=>a.getAttribute(\'href\')).filter(Boolean)")'
              good = 'driver.execute_script("""return [...document.querySelectorAll(\'a[href*="#/"]\')].map(a=>a.getAttribute(\'href\')).filter(Boolean)""")'
              script = script.replace(bad, good)
              exec(compile(script, 'ui_i18n_audit.py', 'exec'), {"__name__": "__main__"})
          except Exception:
              (output / 'error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PYRUN
      - name: Execute DOM-level audit
        run: python scripts/ui_i18n_dom_audit.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ui-i18n-audit
          path: |
            ui-i18n-audit/
            ui-i18n-dom-audit/
          if-no-files-found: error
          retention-days: 7
