name: Kernel Bilingual Functional Gate

on:
  workflow_dispatch:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'index.html'
      - 'assets/kernel-i18n-full.js'
      - 'assets/kernel-platform-bridge.js'
      - 'assets/kernel-team-core-bridge.js'
      - 'assets/kernel-research-core-bridge.js'
      - '.github/workflows/kernel-i18n-functional-gate.yml'

permissions:
  contents: write

jobs:
  bilingual:
    name: Verify Spanish and English parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run bilingual browser test
        id: bilingual
        continue-on-error: true
        run: |
          mkdir -p ci-i18n ci-results
          set +e
          python3 -m http.server 4177 >ci-i18n/http-server.log 2>&1 &
          server_pid=$!
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then printf 'No browser executable found.\n' > ci-i18n/error.txt; exit 1; fi
          rm -rf /tmp/kernel-i18n-cdp-profile
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --no-default-browser-check --remote-debugging-address=127.0.0.1 --remote-debugging-port=9227 --remote-allow-origins='*' --user-data-dir=/tmp/kernel-i18n-cdp-profile about:blank >ci-i18n/chrome.stdout.log 2>ci-i18n/chrome.stderr.log &
          browser_pid=$!
          cleanup() { kill "$browser_pid" "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 200); do if curl --fail --silent http://127.0.0.1:9227/json/version > ci-i18n/cdp-version.json; then ready=1; break; fi; sleep .1; done
          if [ "$ready" -ne 1 ]; then printf 'CDP endpoint unavailable.\n' > ci-i18n/error.txt; exit 1; fi

          cat > /tmp/kernel-i18n-functional.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const endpoint = 'http://127.0.0.1:9227';
          const baseUrl = 'http://127.0.0.1:4177';
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

          async function run() {
            const targetResponse = await fetch(`${endpoint}/json/new?about:blank`, { method: 'PUT' });
            if (!targetResponse.ok) throw new Error(`Could not create target: HTTP ${targetResponse.status}`);
            const target = await targetResponse.json();
            const socket = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => { socket.addEventListener('open', resolve, { once: true }); socket.addEventListener('error', reject, { once: true }); });
            let commandId = 0;
            const pending = new Map();
            socket.addEventListener('message', event => {
              const message = JSON.parse(String(event.data));
              if (!message.id || !pending.has(message.id)) return;
              const request = pending.get(message.id);
              pending.delete(message.id);
              message.error ? request.reject(new Error(JSON.stringify(message.error))) : request.resolve(message.result);
            });
            const command = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++commandId;
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
              setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error(`CDP timeout: ${method}`)); } }, 20000);
            });
            const evaluate = async expression => {
              const result = await command('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || 'Runtime evaluation failed.');
              return result.result?.value;
            };
            const waitFor = async (expression, label, attempts = 70) => {
              for (let attempt = 0; attempt < attempts; attempt += 1) {
                await sleep(400);
                if (await evaluate(`Boolean(${expression})`)) return;
              }
              throw new Error(`Timed out waiting for ${label}`);
            };
            const navigate = async (url, expression, label) => {
              await command('Page.navigate', { url });
              await waitFor(expression, label);
              const html = await evaluate('document.documentElement.outerHTML');
              await fs.writeFile(`ci-i18n/${label.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.html`, html || '', 'utf8');
            };

            await command('Page.enable');
            await command('Runtime.enable');
            await navigate(`${baseUrl}/#/home`, `document.querySelector('#kernel-language-switch') && document.documentElement.lang === 'es'`, 'spanish-home');
            await evaluate(`document.querySelector('#kernel-language-switch').click()`);
            await waitFor(`document.documentElement.lang === 'en' && /Home/.test(document.documentElement.outerHTML) && /Services/.test(document.documentElement.outerHTML)`, 'English navigation');

            await navigate(`${baseUrl}/?kernelSection=formacion#/quienesSomos`, `document.documentElement.lang === 'en' && document.documentElement.outerHTML.includes('Academic background and experience') && document.documentElement.outerHTML.includes('Academic background')`, 'english-formation');
            await navigate(`${baseUrl}/#/equipment`, `document.documentElement.lang === 'en' && document.documentElement.outerHTML.includes('Research team') && document.documentElement.outerHTML.includes('International researcher')`, 'english-team');
            await navigate(`${baseUrl}/#/publicaciones`, `document.documentElement.lang === 'en' && document.documentElement.outerHTML.includes('El Kernel publications') && document.documentElement.outerHTML.includes('Unique records')`, 'english-publications');
            await navigate(`${baseUrl}/#/proyectos`, `document.documentElement.lang === 'en' && document.documentElement.outerHTML.includes('Projects and strategic proposals') && document.documentElement.outerHTML.includes('Featured approved projects')`, 'english-projects');
            await navigate(`${baseUrl}/#/herramientas`, `document.documentElement.lang === 'en' && document.documentElement.outerHTML.includes('ITLA · Xmera') && document.documentElement.outerHTML.includes('APEC · Banner') && /Tools/.test(document.documentElement.outerHTML)`, 'english-tools');

            await evaluate(`document.querySelector('#kernel-language-switch').click()`);
            await waitFor(`document.documentElement.lang === 'es' && /Portada/.test(document.documentElement.outerHTML)`, 'Spanish restoration');

            const report = {
              passed: true,
              languages: ['es', 'en'],
              verified_routes: ['home', 'quienesSomos/formacion', 'equipment', 'publicaciones', 'proyectos', 'herramientas']
            };
            await fs.writeFile('ci-i18n/summary.json', `${JSON.stringify(report, null, 2)}\n`, 'utf8');
            const message = 'Bilingual gate PASS: the native selector changes the platform and the integrated Team, Formación, Publications 2.0 and Projects 2.0 modules between Spanish and English.';
            await fs.writeFile('ci-i18n/result.txt', `${message}\n`, 'utf8');
            console.log(message);
            await command('Page.close').catch(() => {});
            socket.close();
          }

          run().catch(async error => {
            const message = error?.stack || String(error);
            await fs.writeFile('ci-i18n/error.txt', `${message}\n`, 'utf8').catch(() => {});
            console.error(message);
            process.exit(1);
          });
          NODE

          node /tmp/kernel-i18n-functional.mjs >ci-i18n/node.stdout.log 2>ci-i18n/node.stderr.log
          status=$?
          cat ci-i18n/node.stdout.log
          cat ci-i18n/node.stderr.log >&2
          exit "$status"
      - name: Upload bilingual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bilingual-functional-diagnostic
          path: ci-i18n/**
          if-no-files-found: error
          retention-days: 7
      - name: Persist bilingual result
        if: always() && github.event_name == 'push'
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.bilingual.outcome }}
        run: |
          mkdir -p ci-results
          if [ -f ci-i18n/result.txt ]; then status=success; cp ci-i18n/result.txt ci-results/platform-i18n-functional.log; else status=failure; if [ -f ci-i18n/error.txt ]; then cp ci-i18n/error.txt ci-results/platform-i18n-functional.log; else printf 'Bilingual test did not produce a diagnostic.\n' > ci-results/platform-i18n-functional.log; fi; fi
          cat > ci-results/platform-i18n-functional.json <<EOF
          {
            "phase": "2B",
            "status": "${status}",
            "step_outcome": "${OUTCOME}",
            "run_id": "${RUN_ID}",
            "validated_sha": "${HEAD_SHA}",
            "languages": ["es", "en"]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/platform-i18n-functional.json ci-results/platform-i18n-functional.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Phase 2B bilingual result"
          git fetch origin fase-2b-platform-integration
          git rebase origin/fase-2b-platform-integration
          git push origin HEAD:fase-2b-platform-integration
      - name: Enforce bilingual result
        if: steps.bilingual.outcome != 'success'
        run: exit 1
