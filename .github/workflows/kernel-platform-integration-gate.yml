name: Kernel Platform Integration Gate

on:
  workflow_dispatch:
  push:
    branches: [fase-2b-platform-integration]
    paths:
      - 'index.html'
      - 'assets/kernel-platform-bridge.js'
      - 'assets/kernel-team-core-bridge.js'
      - 'assets/kernel-research-core-bridge.js'
      - 'core/data/**'
      - 'platform/**'
      - '*.jpg'
      - '*.png'
      - 'assets/img/**'
      - '.github/workflows/kernel-platform-integration-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/kernel-platform-bridge.js'
      - 'assets/kernel-team-core-bridge.js'
      - 'assets/kernel-research-core-bridge.js'
      - 'core/data/**'
      - 'platform/**'
      - '*.jpg'
      - '*.png'
      - 'assets/img/**'
      - '.github/workflows/kernel-platform-integration-gate.yml'

permissions:
  contents: write

jobs:
  validate:
    name: Preserve platform and integrate Kernel Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check bridge syntax
        run: |
          node --check assets/kernel-platform-bridge.js
          node --check assets/kernel-team-core-bridge.js
          node --check assets/kernel-research-core-bridge.js
      - name: Validate platform preservation and data catalogs
        run: |
          mkdir -p ci-results
          set +e
          node platform/validate-platform-integration.mjs > ci-results/platform-integration.log 2>&1
          validator_status=$?
          cat ci-results/platform-integration.log
          echo "validator_exit=${validator_status}"
          exit "${validator_status}"
      - name: Verify critical local files
        run: |
          test -f assets/kernel-platform-bridge.js
          test -f assets/kernel-team-core-bridge.js
          test -f assets/kernel-research-core-bridge.js
          test -f core/data/researchers.v2.json
          test -f core/data/projects.v2.json
          test -f core/data/publications.v2.json
          test -f miguel.jpg
          test -f natanael.jpg
          test -f randy.jpg
          test -f antmel.jpg
          test -f marino.png
          test -f marckelly.jpg
          test -f josealberto.jpg
          test -f assets/img/alicia-cordero.svg
          test -f assets/img/juan-torregrosa.svg
          test -f assets/LaboratorioKernel-DQR0aCHt.js
          test -f assets/authGuard-CEzcrBkK.js
          test -f assets/authService-CgfoSPdf.js
          test -f assets/firebase-BzP43VG7.js
          test -f assets/CalculadoraTamanoMuestraPotencia-DLJx5UHY.js
          test -f assets/BibliotecaMetodologica-BzzsJJUi.js
      - name: Test static delivery locally
        run: |
          python3 -m http.server 4173 >/tmp/kernel-platform-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/index.html | grep -q 'kernel-platform-bridge.js'
          curl --fail --silent http://127.0.0.1:4173/index.html | grep -q 'kernel-team-core-bridge.js'
          curl --fail --silent http://127.0.0.1:4173/index.html | grep -q 'kernel-research-core-bridge.js'
          ! curl --fail --silent http://127.0.0.1:4173/index.html | grep -q 'kernel-members-patch.js'
          curl --fail --silent http://127.0.0.1:4173/assets/kernel-platform-bridge.js | grep -q 'FORMATION_ROUTE = "quienesSomos"'
          curl --fail --silent http://127.0.0.1:4173/assets/kernel-platform-bridge.js | grep -q 'FORMATION_SECTION = "formacion"'
          curl --fail --silent http://127.0.0.1:4173/assets/kernel-team-core-bridge.js | grep -q 'data-kernel-platform-page="team-nine"'
          curl --fail --silent http://127.0.0.1:4173/assets/kernel-research-core-bridge.js | grep -q 'data-kernel-platform-page="publications-2"'
          curl --fail --silent http://127.0.0.1:4173/assets/kernel-research-core-bridge.js | grep -q 'data-kernel-platform-page="projects-2"'
          curl --fail --silent http://127.0.0.1:4173/core/data/researchers.v2.json | grep -q '"member_count": 9'
          curl --fail --silent http://127.0.0.1:4173/core/data/projects.v2.json | grep -q '"featured_approved_projects": 10'
          curl --fail --silent http://127.0.0.1:4173/core/data/publications.v2.json | grep -q '"unique_records": 162'
          curl --fail --silent --output /dev/null http://127.0.0.1:4173/miguel.jpg
          curl --fail --silent --output /dev/null http://127.0.0.1:4173/assets/img/alicia-cordero.svg
          curl --fail --silent --output /dev/null http://127.0.0.1:4173/assets/img/juan-torregrosa.svg
      - name: Browser smoke test preserved and integrated routes
        run: |
          mkdir -p ci-browser
          python3 -m http.server 4174 >/tmp/kernel-browser-http.log 2>&1 &
          server_pid=$!
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          rm -rf /tmp/kernel-cdp-profile
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --disable-component-update \
            --disable-default-apps \
            --disable-domain-reliability \
            --disable-extensions \
            --disable-sync \
            --metrics-recording-only \
            --no-first-run \
            --safebrowsing-disable-auto-update \
            --remote-debugging-port=9225 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/kernel-cdp-profile \
            about:blank >/tmp/kernel-chrome.out 2>/tmp/kernel-chrome.err &
          browser_pid=$!
          cleanup() {
            kill "$browser_pid" "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 2
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:9225/json/version >/dev/null; then break; fi
            sleep .1
          done
          cat > /tmp/kernel-cdp-smoke.mjs <<'NODE'
          import fs from 'node:fs/promises';

          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const endpoint = 'http://127.0.0.1:9225';
          const baseUrl = 'http://127.0.0.1:4174';
          const checks = [
            { route: 'herramientas', name: 'herramientas', expression: 'html.includes("Xmera") && html.includes("Banner")' },
            { route: 'laboratorioKernel', name: 'laboratorio', expression: '/Laboratorio|Iniciar sesión|Área protegida|Sign in|Authentication/i.test(html)' },
            { route: 'equipment', name: 'equipo', expression: 'html.includes("data-kernel-platform-page=\\"team-nine\\"") && html.includes("Miguel A. Leonardo")' },
            { route: 'quienesSomos/formacion', name: 'formacion', expression: 'html.includes("data-kernel-platform-page=\\"academic-background\\"") && /Formación académica y experiencia|Academic background and experience/i.test(html)' },
            { route: 'publicaciones', name: 'publicaciones', expression: 'html.includes("data-kernel-platform-page=\\"publications-2\\"") && html.includes("162")' },
            { route: 'proyectos', name: 'proyectos', expression: 'html.includes("data-kernel-platform-page=\\"projects-2\\"") && /10/.test(html)' }
          ];

          const targetResponse = await fetch(`${endpoint}/json/new?about:blank`, { method: 'PUT' });
          if (!targetResponse.ok) throw new Error(`Could not create CDP target: HTTP ${targetResponse.status}`);
          const target = await targetResponse.json();
          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener('open', resolve, { once: true });
            socket.addEventListener('error', reject, { once: true });
          });

          let commandId = 0;
          const pending = new Map();
          socket.addEventListener('message', event => {
            const message = JSON.parse(String(event.data));
            if (!message.id || !pending.has(message.id)) return;
            const request = pending.get(message.id);
            pending.delete(message.id);
            if (message.error) request.reject(new Error(JSON.stringify(message.error)));
            else request.resolve(message.result);
          });

          const command = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++commandId;
            pending.set(id, { resolve, reject });
            socket.send(JSON.stringify({ id, method, params }));
            setTimeout(() => {
              if (!pending.has(id)) return;
              pending.delete(id);
              reject(new Error(`CDP command timed out: ${method}`));
            }, 15000);
          });

          await command('Page.enable');
          await command('Runtime.enable');
          const failures = [];

          for (const check of checks) {
            const url = `${baseUrl}/#/${check.route}`;
            await command('Page.navigate', { url });
            let passed = false;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              await sleep(500);
              const evaluation = await command('Runtime.evaluate', {
                expression: `(() => { const html = document.documentElement.outerHTML; return Boolean(${check.expression}); })()`,
                returnByValue: true
              });
              if (evaluation.result?.value === true) {
                passed = true;
                break;
              }
            }
            const dom = await command('Runtime.evaluate', {
              expression: 'document.documentElement.outerHTML',
              returnByValue: true
            });
            await fs.writeFile(`ci-browser/${check.name}.html`, dom.result?.value || '', 'utf8');
            const location = await command('Runtime.evaluate', {
              expression: 'location.href',
              returnByValue: true
            });
            await fs.writeFile(`ci-browser/${check.name}.url.txt`, String(location.result?.value || ''), 'utf8');
            if (!passed) failures.push(`${check.name}: expected route content was not rendered at ${location.result?.value || url}`);
          }

          if (failures.length) {
            await fs.writeFile('ci-browser/failures.txt', `${failures.join('\n')}\n`, 'utf8');
            console.error('Browser smoke test failed:');
            failures.forEach(failure => console.error(`- ${failure}`));
            process.exitCode = 1;
          } else {
            const message = 'Browser smoke test PASS: Laboratorio, Xmera, Banner, Equipo, Formación, Publicaciones 2.0 y Proyectos 2.0.';
            await fs.writeFile('ci-browser/result.txt', `${message}\n`, 'utf8');
            console.log(message);
          }

          await command('Page.close').catch(() => {});
          socket.close();
          NODE
          node /tmp/kernel-cdp-smoke.mjs
      - name: Upload browser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-platform-browser-diagnostic
          path: ci-browser/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload controlled platform preview
        uses: actions/upload-artifact@v4
        with:
          name: kernel-platform-phase-2b-preview
          path: |
            index.html
            assets/**
            core/data/**
            platform/**
            CNAME
            .nojekyll
            miguel.jpg
            natanael.jpg
            randy.jpg
            antmel.jpg
            marino.png
            marckelly.jpg
            josealberto.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Persist integration gate result
        if: always() && github.event_name == 'push'
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-results
          cat > ci-results/platform-integration.json <<EOF
          {
            "phase": "2B",
            "status": "${JOB_STATUS}",
            "run_id": "${RUN_ID}",
            "validated_sha": "${HEAD_SHA}",
            "preserved": ["Laboratorio Inteligente", "ITLA · Xmera", "UNAPEC · Banner", "menús", "autenticación"],
            "integrated": ["Formación académica", "Equipo de 9 investigadores", "Publicaciones 2.0", "Proyectos 2.0"]
          }
          EOF
          test -f ci-results/platform-integration.log || printf 'Validation did not produce a log.\n' > ci-results/platform-integration.log
          if [ -f ci-browser/result.txt ]; then cp ci-browser/result.txt ci-results/platform-browser-smoke.log; elif [ -f ci-browser/failures.txt ]; then cp ci-browser/failures.txt ci-results/platform-browser-smoke.log; else printf 'Browser smoke test did not complete.\n' > ci-results/platform-browser-smoke.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/platform-integration.json ci-results/platform-integration.log ci-results/platform-browser-smoke.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Phase 2B integration gate result"
          git fetch origin fase-2b-platform-integration
          git rebase origin/fase-2b-platform-integration
          git push origin HEAD:fase-2b-platform-integration
