name: Kernel News Modal Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/kernel-news-modal-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-modals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Start local site
        run: |
          python -m http.server 4197 >/tmp/kernel-news-modal-http.log 2>&1 &
          echo $! >/tmp/kernel-news-modal-http.pid
          sleep 2
      - name: Capture every news detail
        run: |
          mkdir -p kernel-news-modal-diagnostic
          python - <<'PY'
          import json, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          out=Path('kernel-news-modal-diagnostic')
          options=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=1440,1800']:
              options.add_argument(arg)
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,60)
          output=[]
          try:
              driver.get('http://127.0.0.1:4197/#/noticias')
              wait.until(lambda d:d.execute_script('return document.readyState')=='complete')
              wait.until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'[data-news-btn]'))>=10)
              ids=driver.execute_script("return [...document.querySelectorAll('[data-news-btn]')].map(b=>b.dataset.newsBtn)")
              for news_id in ids:
                  driver.execute_script("document.querySelector('[data-news-btn=\\"'+arguments[0]+'\\"]')?.click()",news_id)
                  time.sleep(.5)
                  data=driver.execute_script("""
                    const normalize=v=>String(v||'').replace(/\s+/g,' ').trim();
                    const candidates=[...document.querySelectorAll('body > div, [role=dialog], [aria-modal=true]')]
                      .filter(e=>{const s=getComputedStyle(e),b=e.getBoundingClientRect();return b.width>300&&b.height>200&&s.display!=='none'&&s.visibility!=='hidden'&&normalize(e.innerText);});
                    const modal=candidates.sort((a,b)=>b.getBoundingClientRect().width*b.getBoundingClientRect().height-a.getBoundingClientRect().width*a.getBoundingClientRect().height)[0];
                    if(!modal)return null;
                    return {
                      text:normalize(modal.innerText),
                      html:modal.outerHTML,
                      elements:[...modal.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,button,a')].map(e=>({tag:e.tagName.toLowerCase(),text:normalize(e.innerText||e.textContent),ariaLabel:e.getAttribute('aria-label')||''})).filter(x=>x.text||x.ariaLabel)
                    };
                  """)
                  output.append({'id':news_id,'modal':data})
                  if data:
                      (out/f'{news_id}.html').write_text(data['html'],encoding='utf-8')
                  driver.save_screenshot(str(out/f'{news_id}.png'))
                  driver.execute_script("""
                    const visible=[...document.querySelectorAll('button')].filter(b=>/Cerrar|Close/i.test(b.innerText||b.getAttribute('aria-label')||'')&&getComputedStyle(b).display!=='none');
                    (visible[visible.length-1]||document.querySelector('[aria-modal=true] button'))?.click();
                  """)
                  time.sleep(.25)
          finally:
              driver.quit()
          (out/'result.json').write_text(json.dumps(output,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({item['id']:len(item['modal']['elements']) if item['modal'] else 0 for item in output},indent=2))
          PY
      - name: Stop local site
        if: always()
        run: |
          if [ -f /tmp/kernel-news-modal-http.pid ]; then kill "$(cat /tmp/kernel-news-modal-http.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-news-modal-diagnostic
          path: kernel-news-modal-diagnostic/
          if-no-files-found: error
          retention-days: 7
