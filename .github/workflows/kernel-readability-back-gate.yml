name: Kernel Readability and Profile Return Gate

on:
  workflow_dispatch:
  push:
    branches: [hotfix-readability-back-button]
    paths:
      - 'index.html'
      - 'assets/kernel-readability-navigation-fix.js'
      - 'platform/readability_back_regression.py'
      - '.github/workflows/kernel-readability-back-gate.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/kernel-readability-navigation-fix.js'
      - 'platform/readability_back_regression.py'
      - '.github/workflows/kernel-readability-back-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate back button and readable scientific text
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Validate syntax and linked assets
        run: |
          node --check assets/kernel-readability-navigation-fix.js
          python -m py_compile platform/readability_back_regression.py
          grep -q 'kernel-readability-navigation-fix.js' index.html
      - name: Start controlled preview
        run: |
          python -m http.server 4177 >/tmp/kernel-readability-http.log 2>&1 &
          echo $! >/tmp/kernel-readability-http.pid
          sleep 2
      - name: Run readability and return regression
        env:
          BASE_URL: http://127.0.0.1:4177
          READABILITY_RESULT: ci-readability/result.json
        run: python platform/readability_back_regression.py
      - name: Stop controlled preview
        if: always()
        run: |
          if [ -f /tmp/kernel-readability-http.pid ]; then kill "$(cat /tmp/kernel-readability-http.pid)" || true; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-readability-back-result
          path: |
            ci-readability/result.json
            /tmp/kernel-readability-http.log
          if-no-files-found: warn
          retention-days: 7
